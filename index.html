<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Description Parser with AI Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #555; }
        .loader, .ai-loader {
            border: 5px solid #f3f3f3; /* Light grey */
            border-top: 5px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        .ai-loader {
            width: 30px;
            height: 30px;
            border-width: 4px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #warningsArea ul { list-style-type: disc; margin-left: 20px; }
        #warningsArea li { margin-bottom: 4px; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Legal Description Parser</h1>

        <div class="mb-6">
            <label for="txtFile" class="block text-sm font-medium text-gray-700 mb-1">1. Upload .txt File:</label>
            <input type="file" id="txtFile" accept=".txt" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
        
        <div class="mb-6">
            <label for="fileEncoding" class="block text-sm font-medium text-gray-700 mb-1">2. Select File Encoding (if known):</label>
            <select id="fileEncoding" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
                <option value="auto">Auto-detect (UTF-8 default)</option>
                <option value="windows-1252" selected>ANSI (Windows-1252)</option>
                <option value="ISO-8859-1">ANSI (ISO-8859-1)</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">If you see '' characters in warnings or output, try a different encoding or re-save your file as UTF-8.</p>
        </div>

        <div class="mb-6">
            <label for="firstCurveRL" class="block text-sm font-medium text-gray-700 mb-1">3. If first segment is a curve, specify its direction:</label>
            <select id="firstCurveRL" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
                <option value="auto" selected>Auto-detect (recommended)</option>
                <option value="L">Left</option>
                <option value="R">Right</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">Only needed if the very first segment is a curve.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="processButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-150 ease-in-out">
                4. Process File
            </button>
            <button id="downloadButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                5. Download Text File
            </button>
        </div>


        <div id="statusArea" class="mt-6 text-center">
            <div id="loader" class="loader hidden"></div>
            <p id="statusMessage" class="text-sm text-gray-600"></p>
        </div>
        
        <div class="mt-8">
            <label for="previewArea" class="block text-sm font-medium text-gray-700 mb-1">Parsed Output Preview:</label>
            <textarea id="previewArea" rows="10" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500" readonly placeholder="Parsed legal description will appear here..."></textarea>
        </div>

        <div id="warningsContainer" class="mt-6 hidden">
            <h3 class="text-md font-semibold text-orange-600 mb-2">Warnings:</h3>
            <div id="warningsArea" class="p-3 border border-orange-300 bg-orange-50 rounded-lg text-sm text-orange-700">
                <ul></ul>
            </div>
        </div>

        <div id="aiSummarySection" class="mt-8 pt-6 border-t border-gray-200">
            <h3 class="text-xl font-semibold text-gray-700 mb-3 text-center">AI Powered Insights</h3>
            <button id="summarizeButton" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 transition duration-150 ease-in-out mb-4" disabled>
                ✨ Summarize Description with AI
            </button>
            <div id="aiLoader" class="ai-loader hidden mx-auto"></div>
            <p id="aiStatusMessage" class="text-sm text-gray-600 text-center mb-2"></p>
            <div id="aiSummaryOutputContainer" class="hidden">
                <label for="aiSummaryArea" class="block text-sm font-medium text-gray-700 mb-1">AI Generated Summary:</label>
                <textarea id="aiSummaryArea" rows="6" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-800 focus:outline-none focus:ring-1 focus:ring-green-500" readonly placeholder="AI summary will appear here..."></textarea>
            </div>
        </div>

    </div>

    <script>
        // To store processed lines for download
        let parsedOutputForDownload = [];

        document.addEventListener('DOMContentLoaded', () => {
            const txtFileInput = document.getElementById('txtFile');
            const fileEncodingSelect = document.getElementById('fileEncoding');
            const processButton = document.getElementById('processButton');
            const downloadButton = document.getElementById('downloadButton');
            const statusMessage = document.getElementById('statusMessage');
            const previewArea = document.getElementById('previewArea');
            const loader = document.getElementById('loader');
            const firstCurveRLSelect = document.getElementById('firstCurveRL');
            const warningsContainer = document.getElementById('warningsContainer');
            const warningsAreaUL = warningsContainer.querySelector('#warningsArea ul');

            const summarizeButton = document.getElementById('summarizeButton');
            const aiLoader = document.getElementById('aiLoader');
            const aiStatusMessage = document.getElementById('aiStatusMessage');
            const aiSummaryArea = document.getElementById('aiSummaryArea');
            const aiSummaryOutputContainer = document.getElementById('aiSummaryOutputContainer');

            processButton.addEventListener('click', async () => {
                previewArea.value = ''; 
                parsedOutputForDownload = []; 
                aiSummaryArea.value = '';
                aiSummaryOutputContainer.classList.add('hidden');
                summarizeButton.disabled = true;
                downloadButton.disabled = true; 
                downloadButton.classList.replace('bg-green-600', 'bg-gray-400');
                downloadButton.classList.replace('hover:bg-green-700', 'hover:bg-gray-500');


                aiStatusMessage.textContent = '';

                statusMessage.textContent = 'Initializing...';
                warningsAreaUL.innerHTML = ''; 
                warningsContainer.classList.add('hidden');
                loader.classList.remove('hidden');

                const file = txtFileInput.files[0];
                const selectedEncoding = fileEncodingSelect.value === "auto" ? undefined : fileEncodingSelect.value;
                const firstCurveRLOverride = firstCurveRLSelect.value;

                if (!file) {
                    statusMessage.textContent = 'Please select a .txt file.';
                    loader.classList.add('hidden');
                    return;
                }

                statusMessage.textContent = 'Reading file...';
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        statusMessage.textContent = 'Parsing legal description...';
                        const rawText = event.target.result;
                        const {formattedLines, warnings, areaSummaryLine} = parseLegalDescription(rawText, firstCurveRLOverride);
                        
                        parsedOutputForDownload = [...formattedLines]; 

                        if (areaSummaryLine) {
                            if (parsedOutputForDownload.length > 0 && parsedOutputForDownload[parsedOutputForDownload.length -1].trim() !== "") { 
                                parsedOutputForDownload.push(""); 
                            }
                            parsedOutputForDownload.push(areaSummaryLine);
                        }
                        
                        previewArea.value = parsedOutputForDownload.join('\n');
                        
                        if (parsedOutputForDownload.length > 0) { 
                            summarizeButton.disabled = false;
                            downloadButton.disabled = false;
                            downloadButton.classList.replace('bg-gray-400', 'bg-green-600');
                            downloadButton.classList.replace('hover:bg-gray-500', 'hover:bg-green-700');
                        }
                        
                        if (warnings.length > 0) {
                            warnings.forEach(warning => {
                                const li = document.createElement('li');
                                li.textContent = warning;
                                warningsAreaUL.appendChild(li);
                            });
                            warningsContainer.classList.remove('hidden');
                            statusMessage.textContent = 'Processing complete. Please review warnings.';
                        } else if (parsedOutputForDownload.length > 0) {
                           statusMessage.textContent = 'Processing complete. Ready to download or summarize.';
                        } else {
                           statusMessage.textContent = 'Processing complete. No data parsed.';
                        }
                        
                    } catch (error) {
                        console.error('Error processing file:', error);
                        statusMessage.textContent = `Error: ${error.message}`;
                    } finally {
                        loader.classList.add('hidden');
                    }
                };
                reader.onerror = () => {
                    statusMessage.textContent = 'Error reading file.';
                    loader.classList.add('hidden');
                };
                reader.readAsText(file, selectedEncoding); 
            });

            downloadButton.addEventListener('click', async () => {
                if (parsedOutputForDownload.length === 0) {
                    statusMessage.textContent = "No processed data to download.";
                    return;
                }
                statusMessage.textContent = "Generating text file...";
                try {
                    await generateAndDownloadTxt(parsedOutputForDownload);
                    statusMessage.textContent = 'Text file downloaded successfully!';
                } catch (error) {
                    statusMessage.textContent = `Error downloading file: ${error.message}`;
                }
            });


            summarizeButton.addEventListener('click', async () => {
                const parsedText = previewArea.value;
                if (!parsedText.trim()) {
                    aiStatusMessage.textContent = 'No parsed description available to summarize.';
                    return;
                }

                aiLoader.classList.remove('hidden');
                aiStatusMessage.textContent = '✨ AI is thinking...';
                aiSummaryArea.value = '';
                aiSummaryOutputContainer.classList.add('hidden');
                summarizeButton.disabled = true;
                downloadButton.disabled = true; 

                const prompt = `Please provide a brief, high-level narrative summary of the following legal land description. Focus on the general shape and overall direction of the property boundary (e.g., "The property starts by heading west, then turns north..."). Do not repeat the exact measurements or bearings, but describe the overall flow of the boundary. The description is:\n\n"${parsedText}"`;

                try {
                    let chatHistory = [];
                    chatHistory.push({ role: "user", parts: [{ text: prompt }] });
                    const payload = { contents: chatHistory };
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorBody = await response.text();
                        throw new Error(`API request failed with status ${response.status}: ${errorBody}`);
                    }

                    const result = await response.json();

                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        const summaryText = result.candidates[0].content.parts[0].text;
                        aiSummaryArea.value = summaryText;
                        aiSummaryOutputContainer.classList.remove('hidden');
                        aiStatusMessage.textContent = 'Summary generated!';
                    } else {
                        console.error('Unexpected API response structure:', result);
                        throw new Error('Failed to extract summary from API response. Unexpected structure.');
                    }
                } catch (error) {
                    console.error('Error calling Gemini API:', error);
                    aiStatusMessage.textContent = `Error generating summary: ${error.message}`;
                    aiSummaryArea.value = "Could not generate summary at this time.";
                    aiSummaryOutputContainer.classList.remove('hidden');
                } finally {
                    aiLoader.classList.add('hidden');
                    summarizeButton.disabled = false;
                    if(parsedOutputForDownload.length > 0) downloadButton.disabled = false; 
                }
            });

        });

        function expandDirection(shorthand) {
            const map = { 'N': 'North', 'S': 'South', 'E': 'East', 'W': 'West' };
            return map[shorthand] || shorthand;
        }

        function parseBearing(bearingString) {
            if (!bearingString) return null;
            // Regex updated to accept ° or the Unicode replacement character U+FFFD ()
            const match = bearingString.match(/([NSEW])\s*(\d{1,3})[°\uFFFD]\s*(\d{1,2})'\s*([\d\.]+)"\s*([NSEW])/i);
            if (!match) return null;
            return {
                dir1: match[1].toUpperCase(),
                deg: parseInt(match[2]),
                min: parseInt(match[3]),
                sec: parseFloat(match[4]),
                dir2: match[5].toUpperCase(),
            };
        }
        
        function bearingToAzimuth(bearing) {
            if (!bearing) return null;
            const angle = bearing.deg + bearing.min / 60 + bearing.sec / 3600;
            if (bearing.dir1 === 'N' && bearing.dir2 === 'E') return angle;
            if (bearing.dir1 === 'S' && bearing.dir2 === 'E') return 180 - angle;
            if (bearing.dir1 === 'S' && bearing.dir2 === 'W') return 180 + angle;
            if (bearing.dir1 === 'N' && bearing.dir2 === 'W') return 360 - angle;
            if (bearing.dir1 === 'N' && !bearing.dir2) return 0;
            if (bearing.dir1 === 'E' && !bearing.dir2) return 90;
            if (bearing.dir1 === 'S' && !bearing.dir2) return 180;
            if (bearing.dir1 === 'W' && !bearing.dir2) return 270;
            return null;
        }

        function decimalToDMS(decimalDegrees) {
            const d = Math.floor(decimalDegrees);
            const mDecimal = (decimalDegrees - d) * 60;
            const m = Math.floor(mDecimal);
            const sDecimal = (mDecimal - m) * 60;
            let s = Math.round(sDecimal);
            
            if (s === 60) {
                s = 0;
                let newM = m + 1;
                if (newM === 60) {
                    newM = 0;
                    return { d: d + 1, m: newM, s };
                }
                return { d, m: newM, s };
            }
            return { d, m, s };
        }

        function formatDMS(dms) {
            return `${dms.d}°${String(dms.m).padStart(2, '0')}'${String(dms.s).padStart(2, '0')}"`;
        }
        
        function parseLegalDescription(rawText, firstCurveRLOverride) {
            const allLinesFromFile = rawText.split('\n');
            const formattedLines = [];
            const warnings = [];
            let currentSegmentData = [];
            let segmentType = null; 
            let lastSegmentCourseString = null; 
            let segmentCounter = 0; 
            let areaSummaryLine = null; 

            for (const line of allLinesFromFile) {
                const trimmedLine = line.trim();
                const segmentHeaderMatch = trimmedLine.match(/^Segment #(\d+)\s*:\s*(Line|Curve)/i);
                const areaMatchTest = trimmedLine.match(/Area:\s*([\d\.]+)\s*Sq\.\s*Ft\.?/i); 

                if (segmentHeaderMatch) {
                    if (segmentType && currentSegmentData.length > 0) {
                        const result = processSegment(currentSegmentData, segmentType, lastSegmentCourseString, formattedLines.length === 0 ? firstCurveRLOverride : "auto", segmentCounter); 
                        if (result.text) formattedLines.push(result.text);
                        if (result.warning) warnings.push(result.warning);
                        if (result.lastCourse) lastSegmentCourseString = result.lastCourse;
                    }
                    segmentCounter = parseInt(segmentHeaderMatch[1]); 
                    segmentType = segmentHeaderMatch[2]; 
                    currentSegmentData = []; 
                    continue; 
                } else if (areaMatchTest) { 
                    if (segmentType && currentSegmentData.length > 0) {
                        const result = processSegment(currentSegmentData, segmentType, lastSegmentCourseString, formattedLines.length === 0 ? firstCurveRLOverride : "auto", segmentCounter);
                        if (result.text) formattedLines.push(result.text);
                        if (result.warning) warnings.push(result.warning);
                    }
                    segmentType = null; 
                    currentSegmentData = []; 
                }


                if (segmentType && trimmedLine !== "") {
                    currentSegmentData.push(trimmedLine);
                }
            }

            if (segmentType && currentSegmentData.length > 0) {
                 const result = processSegment(currentSegmentData, segmentType, lastSegmentCourseString, formattedLines.length === 0 ? firstCurveRLOverride : "auto", segmentCounter);
                if (result.text) formattedLines.push(result.text);
                if (result.warning) warnings.push(result.warning);
            }

            console.log("Starting search for Area line..."); 
            for (const line of allLinesFromFile) {
                const trimmedLine = line.trim();
                const areaMatch = trimmedLine.match(/Area:\s*([\d\.]+)\s*Sq\.\s*Ft\.?/i);
                if (areaMatch) {
                    console.log("Area matched:", areaMatch[0], "Value:", areaMatch[1]); 
                    try {
                        const sqFtValue = parseFloat(areaMatch[1]);
                        if (!isNaN(sqFtValue)) {
                            const formattedSqFt = Math.round(sqFtValue).toLocaleString('en-US');
                            const acres = sqFtValue / 43560;
                            const formattedAcres = acres.toFixed(3);
                            areaSummaryLine = `contains ${formattedSqFt} sq. ft. or ${formattedAcres} Acres`;
                            console.log("Generated areaSummaryLine:", areaSummaryLine); 
                        } else {
                            warnings.push(`Could not parse square footage value from Area data: "${areaMatch[0]}"`);
                            console.warn("NaN for sqFtValue from:", areaMatch[1]); 
                        }
                    } catch (e) {
                        warnings.push(`Error processing Area data "${areaMatch[0]}": ${e.message}`);
                        console.error("Error in area processing:", e); 
                    }
                    break; 
                }
            }
            if (!areaSummaryLine) {
                 warnings.push("Area summary line was not generated. Check input file for 'Area: ... Sq. Ft.' format.");
                 console.log("Area summary line was NOT generated after checking all lines."); 
            }
            
            return {formattedLines, warnings, areaSummaryLine}; 
        }

        function processSegment(segmentData, type, prevLineCourseStr, curveRLOverride, currentSegmentNumber) {
            let outputText = "";
            let warning = null;
            let lastCourseForNextSegment = null;
            const segmentContext = `(Segment #${currentSegmentNumber})`;


            if (type.toLowerCase() === 'line') {
                const courseLengthLine = segmentData.find(l => l.toLowerCase().startsWith('course:'));
                if (courseLengthLine) {
                    const courseMatch = courseLengthLine.match(/Course:\s*([NSEW]\s*\d{1,3}[°\uFFFD]\s*\d{1,2}'\s*[\d\.]+"[NSEW])/i);
                    const lengthMatch = courseLengthLine.match(/Length:\s*([\d\.]+)'?/i);

                    if (courseMatch && lengthMatch) {
                        const bearingStr = courseMatch[1];
                        const bearing = parseBearing(bearingStr); 
                        const length = parseFloat(lengthMatch[1]);

                        if (bearing) {
                            const roundedSeconds = Math.round(bearing.sec);
                            outputText = `thence ${expandDirection(bearing.dir1)} ${bearing.deg}°${String(bearing.min).padStart(2, '0')}'${String(roundedSeconds).padStart(2, '0')}" ${expandDirection(bearing.dir2)} ${length.toFixed(2)} feet`;
                            lastCourseForNextSegment = bearingStr;
                        } else {
                            warning = `Could not parse bearing for line: "${bearingStr}" ${segmentContext}. Check bearing format.`;
                        }
                    } else {
                         warning = `Malformed line segment data (missing Course or Length): "${courseLengthLine}" ${segmentContext}.`;
                    }
                } else {
                    warning = `No course/length data found for line segment ${segmentContext}. Data: ${segmentData.join('; ')}.`;
                }
            } else if (type.toLowerCase() === 'curve') {
                let curve = {};
                segmentData.forEach(line => {
                    let match;
                    if ((match = line.match(/Length:\s*([\d\.]+)'?\s*Radius:\s*([\d\.]+)'?/i))) {
                        curve.length = parseFloat(match[1]);
                        curve.radius = parseFloat(match[2]);
                    } else if ((match = line.match(/Delta:\s*([\d\.]+)\s*\(d\)/i))) {
                        curve.deltaDecimal = parseFloat(match[1]);
                    } else if ((match = line.match(/Chord:\s*([\d\.]+)'?\s*Course:\s*([NSEW]\s*\d{1,3}[°\uFFFD]\s*\d{1,2}'\s*[\d\.]+"[NSEW])/i))) { 
                        curve.chordLength = parseFloat(match[1]);
                        curve.chordCourseStr = match[2];
                    }
                });

                if (curve.length !== undefined && curve.radius !== undefined && curve.deltaDecimal !== undefined && curve.chordLength !== undefined && curve.chordCourseStr !== undefined) {
                    const dmsDelta = decimalToDMS(curve.deltaDecimal);
                    const chordBearing = parseBearing(curve.chordCourseStr); 
                    
                    let rl_display = "R/L"; // Default if undetermined
                    if (curveRLOverride !== "auto" && currentSegmentNumber === 1 && formattedLines.length === 0) { 
                        rl_display = curveRLOverride === "L" ? "Left" : "Right";
                        warning = (warning ? warning + " " : "") + `R/L for first curve manually set to ${rl_display} ${segmentContext}.`;
                    } else if (prevLineCourseStr) {
                        const tangentInBearing = parseBearing(prevLineCourseStr);
                        const tangentInAzimuth = bearingToAzimuth(tangentInBearing); 
                        const chordAzimuth = bearingToAzimuth(chordBearing); 

                        if (tangentInAzimuth !== null && chordAzimuth !== null) {
                            let deflectionToChord = chordAzimuth - tangentInAzimuth;
                            if (deflectionToChord > 180) deflectionToChord -= 360;
                            if (deflectionToChord < -180) deflectionToChord += 360;

                            const deltaHalf = curve.deltaDecimal / 2;
                            
                            if (Math.abs(Math.abs(deflectionToChord) - deltaHalf) < 1.5) { 
                                rl_display = deflectionToChord > 0 ? "Right" : "Left";
                            } else {
                                rl_display = "R/L (Verify)"; 
                                warning = (warning ? warning + " " : "") + `Curve R/L detection uncertain ${segmentContext}. Deflection to chord (${deflectionToChord.toFixed(2)}°) vs. Delta/2 (${deltaHalf.toFixed(2)}°) differs. Prev: ${prevLineCourseStr}, Chord: ${curve.chordCourseStr}. Please verify.`;
                            }
                        } else {
                             rl_display = "R/L (Calc Error)";
                             warning = (warning ? warning + " " : "") + `Could not determine R/L for curve ${segmentContext}: Azimuth calculation failed. Prev: ${prevLineCourseStr}, Chord: ${curve.chordCourseStr}.`;
                        }
                    } else if (curveRLOverride === "auto") { 
                         rl_display = "R/L (Needs Prev. Line)";
                         warning = (warning ? warning + " " : "") + `Curve R/L ${segmentContext} cannot be auto-determined: No previous line segment course and no override. May be the first segment.`;
                    }


                    if (chordBearing) {
                        const roundedChordSeconds = Math.round(chordBearing.sec);
                        // New curve wording
                        outputText = `thence ${curve.length.toFixed(2)} feet along the arc of a ${curve.radius.toFixed(2)} foot radius curve to the ${rl_display}, through a central angel of ${formatDMS(dmsDelta)}, with a long chord of ${expandDirection(chordBearing.dir1)} ${chordBearing.deg}°${String(chordBearing.min).padStart(2,'0')}'${String(roundedChordSeconds).padStart(2,'0')}" ${expandDirection(chordBearing.dir2)} ${curve.chordLength.toFixed(2)} feet;`;
                    } else {
                        warning = (warning ? warning + " " : "") + `Could not parse chord bearing for curve: "${curve.chordCourseStr}" ${segmentContext}.`;
                        // Fallback output if chord bearing fails to parse
                        outputText = `thence ${curve.length.toFixed(2)} feet along the arc of a ${curve.radius.toFixed(2)} foot radius curve to the ${rl_display}, through a central angel of ${formatDMS(dmsDelta)}, with an unparsed long chord.`;
                    }
                } else {
                    warning = `Incomplete curve data ${segmentContext}. Required fields missing. Found: ${JSON.stringify(curve)}. Original data: ${segmentData.join('; ')}.`;
                }
                lastCourseForNextSegment = null; 
            }
            return { text: outputText, warning: warning, lastCourse: lastCourseForNextSegment };
        }

        async function generateAndDownloadTxt(formattedLinesArray) { 
            try {
                const textContent = formattedLinesArray.join('\n');
                const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" }); // Specify UTF-8 for output
                saveAs(blob, `legal_description.txt`); 
            } catch (error) {
                console.error("Error generating TXT file:", error);
                throw new Error('Error generating text file. See console for details.'); 
            }
        }
    </script>
