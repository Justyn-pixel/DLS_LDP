<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Description Parser - Diamond Land Surveying</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <!-- Tooltip styles are now in style.css, but some specific styles are better here for Tailwind compatibility -->
    <style>
        .info-icon-container .tooltip { visibility: hidden; opacity: 0; transition: opacity 0.3s; }
        .info-icon-container:hover .tooltip { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-4xl">
        <div class="text-center mb-10">
            <div class="inline-block mb-3">
                 <img src="https://www.diamondlandsurveying.com/wp-content/uploads/2019/04/diamond-logo-1.jpg" alt="Diamond Land Surveying Logo" class="h-20 w-auto mx-auto">
            </div>
            <h1 class="text-3xl font-bold text-gray-800" style="font-family: 'Montserrat', sans-serif;">Legal Description Parser</h1>
            <p class="text-xs text-gray-500 mt-1">Powered by Gemini</p>
        </div>

        <div id="dropZone" class="mb-6 border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-[#003366] hover:bg-gray-50 transition-colors">
            <p class="text-gray-500 pointer-events-none">Drag & Drop .txt file here or 
                <button id="selectFileButton" class="text-[#003366] hover:text-[#002244] font-semibold underline focus:outline-none">select a file</button>
            </p>
            <input type="file" id="txtFile" accept=".txt" class="hidden">
        </div>
        
        <div class="flex flex-col sm:flex-row sm:items-end sm:space-x-4 mb-6">
            <div class="flex-1 mb-4 sm:mb-0">
                <label for="fileEncoding" class="block text-xs font-medium text-gray-600 mb-1">
                    Encoding:
                    <span class="info-icon-container relative inline-block">
                        <span class="info-icon inline-block w-4 h-4 leading-4 text-center rounded-full bg-[#003366] text-white text-[10px] font-bold cursor-help ml-1">i</span>
                        <span class="tooltip absolute w-56 bg-gray-800 text-white text-left rounded-lg p-2 z-10 bottom-full left-1/2 -translate-x-1/2 mb-2 text-xs leading-tight">Select file encoding. If you see strange characters (like ), try a different encoding or re-save your file as UTF-8.
                            <span class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-solid border-transparent border-t-gray-800"></span>
                        </span>
                    </span>
                </label>
                <select id="fileEncoding" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto (UTF-8)</option>
                    <option value="windows-1252">ANSI (Win-1252)</option>
                    <option value="ISO-8859-1">ANSI (ISO-8859-1)</option>
                </select>
            </div>
            <div class="flex-1">
                <label for="firstCurveRL" class="block text-xs font-medium text-gray-600 mb-1">
                    1st Curve Dir:
                    <span class="info-icon-container relative inline-block">
                        <span class="info-icon inline-block w-4 h-4 leading-4 text-center rounded-full bg-[#003366] text-white text-[10px] font-bold cursor-help ml-1">i</span>
                        <span class="tooltip absolute w-56 bg-gray-800 text-white text-left rounded-lg p-2 z-10 bottom-full left-1/2 -translate-x-1/2 mb-2 text-xs leading-tight">If the very first segment in your file is a curve, specify its direction (Left/Right) here. Otherwise, 'Auto-detect' is recommended.
                            <span class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-solid border-transparent border-t-gray-800"></span>
                        </span>
                    </span>
                </label>
                <select id="firstCurveRL" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto-detect</option>
                    <option value="L">Left</option>
                    <option value="R">Right</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="processButton" class="w-full bg-[#003366] hover:bg-[#002244] text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-[#003366] focus:ring-opacity-50 transition duration-150 ease-in-out">
                Process File
            </button>
            <button id="downloadButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download Text File
            </button>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="downloadCsvButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download CSV
            </button>
            <button id="downloadKmlButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download KML
            </button>
        </div>


        <div id="statusArea" class="mt-6 text-center">
            <div id="loader" class="loader hidden"></div>
            <p id="statusMessage" class="text-sm text-gray-600"></p>
        </div>
        
        <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="previewArea" class="block text-sm font-medium text-gray-700">Parsed Output Preview:</label>
                        <button id="copyButton" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1 px-2 rounded-md transition-colors duration-150 ease-in-out">
                            Copy
                        </button>
                    </div>
                    <textarea id="previewArea" rows="12" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-800" readonly placeholder="Parsed legal description will appear here..."></textarea>
                </div>

                <!-- NEW: Container for manual controls -->
                <div id="manualControlsContainer" class="mt-4 space-y-2">
                    <!-- Manual controls for curves will be injected here -->
                </div>
                <!-- END NEW -->

                <div id="warningsContainer" class="mt-6 hidden">
                    <div class="flex items-center text-orange-600 mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.21 3.03-1.742 3.03H4.42c-1.532 0-2.492-1.696-1.742-3.03l5.58-9.92zM10 13a1 1 0 110-2 1 1 0 010 2zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                        <h3 class="text-md font-semibold">Warnings</h3>
                    </div>
                    <div id="warningsArea" class="p-4 border-l-4 border-orange-400 bg-orange-50 rounded-r-lg text-sm text-orange-800">
                        <ul></ul>
                    </div>
                </div>
            </div>

            <div>
                <div>
                    <label for="traversePlot" class="block text-sm font-medium text-gray-700 mb-1">Traverse Plot:</label>
                    <canvas id="traversePlot" width="400" height="300" class="w-full h-auto aspect-[4/3]"></canvas>
                </div>

                <div id="resultsContainer" class="mt-6 hidden">
                    <div class="flex items-center text-blue-800 mb-2">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2H6zm1 2a1 1 0 00-1 1v1a1 1 0 001 1h6a1 1 0 001-1V5a1 1 0 00-1-1H7zM6 9a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd" />
                        </svg>
                        <h3 class="text-md font-semibold">Calculation Results</h3>
                    </div>
                    <div id="resultsArea" class="p-4 border-l-4 border-blue-400 bg-blue-50 rounded-r-lg text-sm text-blue-900 space-y-2">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
