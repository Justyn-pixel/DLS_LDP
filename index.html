<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Description Parser - Diamond Land Surveying</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('assets/background-topo.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
        }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #555; }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #003366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #warningsArea ul, #rlInputArea ul { list-style-type: disc; margin-left: 20px; } /* Combined style */
        #warningsArea li, #rlInputArea li { margin-bottom: 4px; } /* Combined style */
         #rlInputArea li { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; } /* Style for R/L inputs */
        #rlInputArea select { width: 100px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem;} /* Style for dropdowns */
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #003366 !important;
            box-shadow: 0 0 0 2px rgba(0, 51, 102, 0.3) !important;
        }
        #dropZone.dragover {
            border-color: #003366;
            background-color: rgba(0, 51, 102, 0.05);
        }
        .info-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            border-radius: 50%;
            background-color: #003366;
            color: white;
            font-size: 10px;
            font-weight: bold;
            cursor: help;
            margin-left: 4px;
            position: relative;
        }
        .tooltip {
            visibility: hidden;
            width: 220px;
            background-color: #333;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -110px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.75rem;
            line-height: 1.25;
        }
        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        .info-icon-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        #traversePlot {
            border: 1px solid #d1d5db; /* gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            background-color: #f9fafb; /* gray-50 */
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-4xl">
        <div class="text-center mb-10">
            <div class="inline-block mb-3">
                 <img src="https://www.diamondlandsurveying.com/wp-content/uploads/2019/04/diamond-logo-1.jpg" alt="Diamond Land Surveying Logo" class="h-20 w-auto mx-auto">
            </div>
            <h1 class="text-3xl font-bold text-gray-800" style="font-family: 'Montserrat', sans-serif;">Legal Description Parser</h1>
            <p class="text-xs text-gray-500 mt-1">Powered by Gemini</p>
        </div>

        <div id="dropZone" class="mb-6 border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-[#003366] hover:bg-gray-50 transition-colors">
            <p class="text-gray-500 pointer-events-none">Drag & Drop .txt file here or
                <button id="selectFileButton" class="text-[#003366] hover:text-[#002244] font-semibold underline focus:outline-none">select a file</button>
            </p>
            <input type="file" id="txtFile" accept=".txt" class="hidden">
        </div>

        <div class="flex flex-col sm:flex-row sm:items-end sm:space-x-4 mb-6">
            <div class="flex-1 mb-4 sm:mb-0">
                <label for="fileEncoding" class="block text-xs font-medium text-gray-600 mb-1">
                    Encoding:
                    <span class="info-icon-container relative">
                        <span class="info-icon">i</span>
                        <span class="tooltip">Select file encoding. If you see strange characters (like ), try a different encoding or re-save your file as UTF-8.</span>
                    </span>
                </label>
                <select id="fileEncoding" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto (UTF-8)</option>
                    <option value="windows-1252">ANSI (Win-1252)</option>
                    <option value="ISO-8859-1">ANSI (ISO-8859-1)</option>
                </select>
            </div>
            <div class="flex-1">
                <label for="firstCurveRL" class="block text-xs font-medium text-gray-600 mb-1">
                    1st Curve Dir:
                    <span class="info-icon-container relative">
                        <span class="info-icon">i</span>
                        <span class="tooltip">If the very first segment in your file is a curve, specify its direction (Left/Right) here. Otherwise, 'Auto-detect' is recommended.</span>
                    </span>
                </label>
                <select id="firstCurveRL" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto-detect</option>
                    <option value="L">Left</option>
                    <option value="R">Right</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="processButton" class="w-full bg-[#003366] hover:bg-[#002244] text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-[#003366] focus:ring-opacity-50 transition duration-150 ease-in-out">
                Process File
            </button>
            <button id="downloadButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download Text File
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="downloadCsvButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download CSV
            </button>
            <button id="downloadKmlButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download KML
            </button>
        </div>


        <div id="statusArea" class="mt-6 text-center">
            <div id="loader" class="loader hidden"></div>
            <p id="statusMessage" class="text-sm text-gray-600"></p>
        </div>

        <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6">

            <div>
                <div>
                    <label for="previewArea" class="block text-sm font-medium text-gray-700 mb-1">Parsed Output Preview:</label>
                    <textarea id="previewArea" rows="12" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-800" readonly placeholder="Parsed legal description will appear here..."></textarea>
                </div>

                <div id="rlInputContainer" class="mt-6 hidden">
                    <h3 class="text-md font-semibold text-blue-600 mb-2">Specify Curve Directions:</h3>
                    <div id="rlInputArea" class="p-3 border border-blue-300 bg-blue-50 rounded-lg text-sm text-blue-700">
                        <ul></ul> </div>
                     <button id="updateRlButton" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-opacity-50 transition duration-150 ease-in-out">
                         Update Output with R/L Selections
                     </button>
                </div>
                <div id="warningsContainer" class="mt-6 hidden">
                    <h3 class="text-md font-semibold text-orange-600 mb-2">Warnings:</h3>
                    <div id="warningsArea" class="p-3 border border-orange-300 bg-orange-50 rounded-lg text-sm text-orange-700">
                        <ul></ul>
                    </div>
                </div>
            </div>

            <div>
                <div>
                    <label for="traversePlot" class="block text-sm font-medium text-gray-700 mb-1">Traverse Plot:</label>
                    <canvas id="traversePlot" width="400" height="300" class="w-full h-auto aspect-[4/3]"></canvas>
                </div>

                <div id="resultsContainer" class="mt-6 hidden">
                    <h3 class="text-md font-semibold text-gray-700 mb-2">Calculation Results:</h3>
                    <div id="resultsArea" class="p-3 border border-gray-300 bg-gray-50 rounded-lg text-sm text-gray-800 space-y-2">
                        </div>
                </div>
            </div>

        </div> </div> <script>
        // --- GLOBALS ---
        let parsedOutputForDownload = [];
        let segmentsDataForExport = [];
        let coordinatesForPlotting = [];
        let areaFromFile = null;
        let filePobCoords = null;
        let rawFileText = ''; // *** NEW: Store raw text ***
        let uncertainRlSegments = {}; // *** NEW: Store info for uncertain segments { segNum: segmentDataArray } ***

        // --- CONSTANTS ---
        const R2D = 180 / Math.PI;
        const D2R = Math.PI / 180;
        const GEOMETRY_TOLERANCE = 0.005; // feet
        const TANGENCY_TOLERANCE_DEGREES = (5 / 3600); // 5 seconds
        const NINETY_DEG_TOLERANCE = 1.0; // Tolerance for Tangent vs Radial check (degrees)
        const DELTA_TOLERANCE = 1.0; // Tolerance for Radial In vs Radial Out check (degrees)


        // --- DOM Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            // Get all DOM elements
            const txtFileInput = document.getElementById('txtFile');
            const fileEncodingSelect = document.getElementById('fileEncoding');
            const processButton = document.getElementById('processButton');
            const downloadButton = document.getElementById('downloadButton');
            const downloadCsvButton = document.getElementById('downloadCsvButton');
            const downloadKmlButton = document.getElementById('downloadKmlButton');
            const statusMessage = document.getElementById('statusMessage');
            const previewArea = document.getElementById('previewArea');
            const loader = document.getElementById('loader');
            const firstCurveRLSelect = document.getElementById('firstCurveRL');
            const warningsContainer = document.getElementById('warningsContainer');
            const warningsAreaUL = warningsContainer.querySelector('#warningsArea ul');
            const dropZone = document.getElementById('dropZone');
            const selectFileButton = document.getElementById('selectFileButton');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsArea = document.getElementById('resultsArea');
            const traversePlotCanvas = document.getElementById('traversePlot');
            const rlInputContainer = document.getElementById('rlInputContainer'); // *** NEW ***
            const rlInputAreaUL = rlInputContainer.querySelector('#rlInputArea ul'); // *** NEW ***
            const updateRlButton = document.getElementById('updateRlButton'); // *** NEW ***


            // --- Drag & Drop / File Input Listeners ---
             selectFileButton.addEventListener('click', () => txtFileInput.click());
             dropZone.addEventListener('click', (e) => { if (e.target !== selectFileButton) txtFileInput.click(); });
             dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
             dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
             dropZone.addEventListener('drop', (e) => {
                 e.preventDefault();
                 dropZone.classList.remove('dragover');
                 const files = e.dataTransfer.files;
                 if (files.length > 0) {
                     if (files[0].name.endsWith('.txt')) {
                         txtFileInput.files = files;
                         txtFileInput.dispatchEvent(new Event('change', { bubbles: true }));
                         // processButton.click(); // Optional auto-process
                     } else {
                         statusMessage.textContent = 'Please drop a .txt file.';
                         alert('Invalid file type. Please drop a .txt file.');
                     }
                 }
             });
             txtFileInput.addEventListener('change', () => {
                 if (txtFileInput.files.length > 0) {
                     statusMessage.textContent = `File selected: ${txtFileInput.files[0].name}`;
                     // processButton.click(); // Optional auto-process
                 }
             });

            // --- Main Process Button Listener ---
            processButton.addEventListener('click', async () => {
                // 1. Reset UI and globals
                resetUIAndState();
                loader.classList.remove('hidden');

                const file = txtFileInput.files[0];
                const selectedEncoding = fileEncodingSelect.value === "auto" ? "UTF-8" : fileEncodingSelect.value;

                if (!file) {
                    statusMessage.textContent = 'Please select a .txt file.';
                    loader.classList.add('hidden');
                    return;
                }

                statusMessage.textContent = 'Reading file...';
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        rawFileText = event.target.result; // *** NEW: Store raw text ***
                        filePobCoords = parsePobCoordinates(rawFileText);

                        statusMessage.textContent = 'Parsing legal description...';
                        processFileData(firstCurveRLSelect.value); // Initial processing

                    } catch (error) {
                        handleProcessingError(error);
                    } finally {
                        loader.classList.add('hidden');
                    }
                };
                reader.onerror = () => {
                     statusMessage.textContent = 'Error reading file.';
                     loader.classList.add('hidden');
                };
                reader.readAsText(file, selectedEncoding);
            });

            // --- *** NEW: Update R/L Button Listener *** ---
            updateRlButton.addEventListener('click', () => {
                 const userOverrides = {};
                 const selects = rlInputAreaUL.querySelectorAll('select');
                 selects.forEach(select => {
                     const segNum = select.dataset.segment;
                     const value = select.value;
                     if (value === 'L' || value === 'R') {
                         userOverrides[segNum] = value;
                     }
                 });

                 // Re-process with the overrides
                 resetUIAndState(false); // Reset calculation/output parts, keep raw text/pob
                 statusMessage.textContent = 'Re-processing with user selections...';
                 loader.classList.remove('hidden');

                 try {
                     processFileData(firstCurveRLSelect.value, userOverrides); // Pass overrides
                 } catch (error) {
                    handleProcessingError(error);
                 } finally {
                     loader.classList.add('hidden');
                 }
            });


            // --- Download Button Listeners ---
             downloadButton.addEventListener('click', async () => { /* ... unchanged ... */ });
             downloadCsvButton.addEventListener('click', async () => { /* ... unchanged ... */ });
             downloadKmlButton.addEventListener('click', async () => { /* ... unchanged ... */ });
        });

        // --- *** NEW: Central Processing Function *** ---
        function processFileData(firstCurveRLOverride, userRlOverrides = {}) {
            // Reset parts needed for reprocessing
            parsedOutputForDownload = [];
            segmentsDataForExport = [];
            coordinatesForPlotting = [[0, 0]];
            areaFromFile = null;
            uncertainRlSegments = {}; // Clear uncertain segments for this run

            const {
                formattedLines,
                warnings,
                areaSummaryLine,
                segmentsData,
                parsedAreaValue,
                uncertainSegments // Capture uncertain segments from this run
            } = parseLegalDescription(rawFileText, firstCurveRLOverride, userRlOverrides); // Pass overrides

            // Store results
            parsedOutputForDownload = [...formattedLines];
            segmentsDataForExport = [...segmentsData];
            areaFromFile = parsedAreaValue;
            uncertainRlSegments = uncertainSegments; // Store uncertain ones found in this pass

             if (areaSummaryLine) {
                 if (parsedOutputForDownload.length > 0 && parsedOutputForDownload[parsedOutputForDownload.length -1].trim() !== "") {
                     parsedOutputForDownload.push("");
                 }
                 parsedOutputForDownload.push(areaSummaryLine);
             }

            // Update UI
            document.getElementById('previewArea').value = parsedOutputForDownload.join('\n');
            updateButtonsAndWarnings(warnings, uncertainRlSegments); // Pass uncertain segments to UI update
            updateCalculationResultsAndPlot();
        }

        // --- *** NEW: UI Reset Function *** ---
        function resetUIAndState(fullReset = true) {
            document.getElementById('previewArea').value = '';
            parsedOutputForDownload = [];
            segmentsDataForExport = [];
            coordinatesForPlotting = [[0, 0]];
            areaFromFile = null;
            uncertainRlSegments = {}; // Clear uncertain segments

            if (fullReset) {
                 rawFileText = ''; // Clear raw text only on full reset
                 filePobCoords = null;
            }

             // Disable download buttons
            const buttons = ['downloadButton', 'downloadCsvButton', 'downloadKmlButton'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                btn.disabled = true;
                btn.classList.replace('bg-[#003366]', 'bg-gray-400');
                btn.classList.replace('hover:bg-[#002244]', 'hover:bg-gray-500');
            });


            // Clear warnings, R/L inputs, and results
            document.getElementById('warningsArea ul').innerHTML = '';
            document.getElementById('warningsContainer').classList.add('hidden');
            document.getElementById('rlInputArea ul').innerHTML = ''; // *** NEW ***
            document.getElementById('rlInputContainer').classList.add('hidden'); // *** NEW ***
            document.getElementById('resultsArea').innerHTML = '';
            document.getElementById('resultsContainer').classList.add('hidden');
            clearCanvas(document.getElementById('traversePlot'));
            document.getElementById('statusMessage').textContent = '';
        }

        // --- *** NEW: Error Handling Function *** ---
        function handleProcessingError(error) {
             console.error('Error processing file:', error);
             document.getElementById('statusMessage').textContent = `Error: ${error.message}`;
             const warningsAreaUL = document.getElementById('warningsArea ul');
             warningsAreaUL.innerHTML = `<li>${error.message}</li>`;
             document.getElementById('warningsContainer').classList.remove('hidden');
        }

        // --- *** NEW: Update UI Function *** ---
        function updateButtonsAndWarnings(warnings, uncertainSegments) {
            const warningsAreaUL = document.getElementById('warningsArea ul');
            const warningsContainer = document.getElementById('warningsContainer');
            const rlInputAreaUL = document.getElementById('rlInputArea ul'); // *** NEW ***
            const rlInputContainer = document.getElementById('rlInputContainer'); // *** NEW ***
            const statusMessage = document.getElementById('statusMessage');

            // Update Download Buttons
            if (parsedOutputForDownload.length > 0) {
                 document.getElementById('downloadButton').disabled = false;
                 document.getElementById('downloadButton').classList.replace('bg-gray-400', 'bg-[#003366]');
                 document.getElementById('downloadButton').classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]');
            }
            if (segmentsDataForExport.length > 0) {
                 document.getElementById('downloadCsvButton').disabled = false;
                 document.getElementById('downloadCsvButton').classList.replace('bg-gray-400', 'bg-[#003366]');
                 document.getElementById('downloadCsvButton').classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]');
            }
             if (coordinatesForPlotting.length > 1) {
                 document.getElementById('downloadKmlButton').disabled = false;
                 document.getElementById('downloadKmlButton').classList.replace('bg-gray-400', 'bg-[#003366]');
                 document.getElementById('downloadKmlButton').classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]');
             }

            // Update Warnings Area
             warningsAreaUL.innerHTML = ''; // Clear previous
             if (!filePobCoords && rawFileText.includes("Point of Beginning")) {
                 warnings.push("Could not parse 'Point of Beginning' coordinates. Line endpoint validation skipped.");
             }
             if (warnings.length > 0) {
                 warnings.forEach(warning => {
                     const li = document.createElement('li');
                     li.textContent = warning;
                     warningsAreaUL.appendChild(li);
                 });
                 warningsContainer.classList.remove('hidden');
             } else {
                 warningsContainer.classList.add('hidden');
             }

             // *** NEW: Update R/L Input Area ***
             rlInputAreaUL.innerHTML = ''; // Clear previous
             const uncertainKeys = Object.keys(uncertainSegments);
             if (uncertainKeys.length > 0) {
                 uncertainKeys.sort((a, b) => a - b).forEach(segNum => {
                     const li = document.createElement('li');
                     li.innerHTML = `
                         <span>Segment #${segNum}:</span>
                         <select data-segment="${segNum}">
                             <option value="">Select...</option>
                             <option value="L">Left</option>
                             <option value="R">Right</option>
                         </select>
                     `;
                     rlInputAreaUL.appendChild(li);
                 });
                 rlInputContainer.classList.remove('hidden');
                 statusMessage.textContent = 'Processing complete. Please specify R/L for curves above and click Update.';
                  // Disable downloads until R/L is updated
                  document.getElementById('downloadButton').disabled = true;
                  document.getElementById('downloadCsvButton').disabled = true;
                  document.getElementById('downloadKmlButton').disabled = true;

             } else {
                 rlInputContainer.classList.add('hidden');
                 // Set final status message if no R/L input needed
                 if (warnings.length > 0) {
                     statusMessage.textContent = 'Processing complete. Please review warnings.';
                 } else if (parsedOutputForDownload.length > 0) {
                     statusMessage.textContent = 'Processing complete. Ready to download.';
                 } else {
                     statusMessage.textContent = 'Processing complete. No data parsed.';
                 }
             }
             // *** END NEW ***
        }

         // *** NEW: Update Calculations and Plot Function ***
         function updateCalculationResultsAndPlot() {
            if (coordinatesForPlotting.length > 1) {
                calculateAndDisplayResults(coordinatesForPlotting, areaFromFile);
                document.getElementById('resultsContainer').classList.remove('hidden');
                drawTraverse(document.getElementById('traversePlot'), coordinatesForPlotting);
            } else {
                 document.getElementById('resultsContainer').classList.add('hidden');
                 clearCanvas(document.getElementById('traversePlot'));
            }
         }


        // --- Core Parsing Logic ---

        function parsePobCoordinates(rawText) { /* ... unchanged ... */ }

        function parseLegalDescription(rawText, firstCurveRLOverride, userRlOverrides = {}) { // Accept overrides
            const allLinesFromFile = rawText.split('\n');
            const formattedLines = [];
            const warnings = [];
            let segmentsData = [];
            let currentSegmentData = [];
            let segmentType = null;
            let lastSegmentCourseString = null;
            let segmentCounter = 0;
            let areaSummaryLine = null;
            let parsedAreaValue = null;
            let lastSegmentWasCurve = false;
            let uncertainSegmentsOutput = {}; // *** NEW: Track uncertain segments ***

            let currentCoordinates = [0, 0];
             coordinatesForPlotting = [[0, 0]]; // Reset global plot coords for this run


            for (const line of allLinesFromFile) {
                const trimmedLine = line.trim();
                const segmentHeaderMatch = trimmedLine.match(/^Segment\s+#(\d+)\s*:\s*(Line|Curve)/i);
                const areaMatchTest = trimmedLine.match(/Area:\s*([\d.,]+)\s*Sq\.\s*Ft\.?/i);

                if (segmentHeaderMatch) {
                    if (segmentType && currentSegmentData.length > 0) {
                         // Check if user provided an override for this segment
                         const rlOverride = userRlOverrides[segmentCounter] || null;

                        const result = processSegment(
                            currentSegmentData, segmentType, lastSegmentCourseString,
                            firstCurveRLOverride, segmentCounter, formattedLines.length === 0,
                            currentCoordinates, lastSegmentWasCurve,
                            rlOverride // Pass override to processSegment
                        );

                        // Modify previous line if this is a curve
                        if (segmentType.toLowerCase() === 'curve' && result.tangencyStatus && formattedLines.length > 0) {
                            let lastLine = formattedLines.pop();
                            if (lastLine.endsWith('feet;')) {
                                if (result.tangencyStatus === 'non-tangent') {
                                    lastLine = lastLine.replace(/feet;$/, 'feet to a point of non-tangent curvature;');
                                } else {
                                    lastLine = lastLine.replace(/feet;$/, 'feet to a point of curvature;');
                                }
                            }
                            formattedLines.push(lastLine);
                        }

                        if (result.text) formattedLines.push(result.text);
                        if(result.validationWarnings && result.validationWarnings.length > 0) warnings.push(...result.validationWarnings);
                        if (result.warning) warnings.push(result.warning);
                        if (result.segmentData) segmentsData.push(result.segmentData);

                        // *** NEW: Store uncertain segment data ***
                        if (result.isRlUncertain) {
                            uncertainSegmentsOutput[segmentCounter] = currentSegmentData;
                        }
                        // *** END NEW ***

                        if (result.lastCourse) lastSegmentCourseString = result.lastCourse;
                        lastSegmentWasCurve = (segmentType.toLowerCase() === 'curve');
                        if(result.endCoordinates) {
                            currentCoordinates = result.endCoordinates;
                            coordinatesForPlotting.push(currentCoordinates);
                        }
                    }
                    segmentCounter = parseInt(segmentHeaderMatch[1]);
                    segmentType = segmentHeaderMatch[2];
                    currentSegmentData = [];
                    continue;
