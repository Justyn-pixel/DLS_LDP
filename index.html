<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Description Parser - Diamond Land Surveying</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('assets/background-topo.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
        }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #555; }
        .loader { 
            border: 5px solid #f3f3f3; 
            border-top: 5px solid #003366; 
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Style for both Warnings and R/L Input lists */
        #warningsArea ul, #rlInputArea ul { list-style-type: disc; margin-left: 20px; }
        #warningsArea li, #rlInputArea li { margin-bottom: 4px; }
        /* Specific style for R/L input list items */
         #rlInputArea li { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        #rlInputArea select { width: 100px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem;}
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #003366 !important; 
            box-shadow: 0 0 0 2px rgba(0, 51, 102, 0.3) !important;
        }
        #dropZone.dragover {
            border-color: #003366; 
            background-color: rgba(0, 51, 102, 0.05); 
        }
        .info-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            border-radius: 50%;
            background-color: #003366; 
            color: white;
            font-size: 10px;
            font-weight: bold;
            cursor: help;
            margin-left: 4px;
            position: relative; 
        }
        .tooltip {
            visibility: hidden;
            width: 220px;
            background-color: #333;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 10;
            bottom: 125%; 
            left: 50%;
            margin-left: -110px; 
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.75rem; 
            line-height: 1.25; 
        }
        .tooltip::after { 
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        .info-icon-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        #traversePlot {
            border: 1px solid #d1d5db; /* gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            background-color: #f9fafb; /* gray-50 */
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-4xl">
        <div class="text-center mb-10">
            <div class="inline-block mb-3">
                 <img src="https://www.diamondlandsurveying.com/wp-content/uploads/2019/04/diamond-logo-1.jpg" alt="Diamond Land Surveying Logo" class="h-20 w-auto mx-auto">
            </div>
            <h1 class="text-3xl font-bold text-gray-800" style="font-family: 'Montserrat', sans-serif;">Legal Description Parser</h1>
            <p class="text-xs text-gray-500 mt-1">Powered by Gemini</p>
        </div>

        <div id="dropZone" class="mb-6 border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-[#003366] hover:bg-gray-50 transition-colors">
            <p class="text-gray-500 pointer-events-none">Drag & Drop .txt file here or 
                <button id="selectFileButton" class="text-[#003366] hover:text-[#002244] font-semibold underline focus:outline-none">select a file</button>
            </p>
            <input type="file" id="txtFile" accept=".txt" class="hidden">
        </div>
        
        <div class="flex flex-col sm:flex-row sm:items-end sm:space-x-4 mb-6">
            <div class="flex-1 mb-4 sm:mb-0">
                <label for="fileEncoding" class="block text-xs font-medium text-gray-600 mb-1">
                    Encoding:
                    <span class="info-icon-container relative">
                        <span class="info-icon">i</span>
                        <span class="tooltip">Select file encoding. If you see strange characters (like ), try a different encoding or re-save your file as UTF-8.</span>
                    </span>
                </label>
                <select id="fileEncoding" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto (UTF-8)</option>
                    <option value="windows-1252">ANSI (Win-1252)</option>
                    <option value="ISO-8859-1">ANSI (ISO-8859-1)</option>
                </select>
            </div>
            <div class="flex-1">
                <label for="firstCurveRL" class="block text-xs font-medium text-gray-600 mb-1">
                    1st Curve Dir:
                    <span class="info-icon-container relative">
                        <span class="info-icon">i</span>
                        <span class="tooltip">If the very first segment in your file is a curve, specify its direction (Left/Right) here. Otherwise, 'Auto-detect' is recommended.</span>
                    </span>
                </label>
                <select id="firstCurveRL" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto-detect</option>
                    <option value="L">Left</option>
                    <option value="R">Right</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="processButton" class="w-full bg-[#003366] hover:bg-[#002244] text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-[#003366] focus:ring-opacity-50 transition duration-150 ease-in-out">
                Process File
            </button>
            <button id="downloadButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download Text File
            </button>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="downloadCsvButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download CSV
            </button>
            <button id="downloadKmlButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download KML
            </button>
        </div>


        <div id="statusArea" class="mt-6 text-center">
            <div id="loader" class="loader hidden"></div>
            <p id="statusMessage" class="text-sm text-gray-600"></p>
        </div>
        
        <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div>
                <div>
                    <label for="previewArea" class="block text-sm font-medium text-gray-700 mb-1">Parsed Output Preview:</label>
                    <textarea id="previewArea" rows="12" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-800" readonly placeholder="Parsed legal description will appear here..."></textarea>
                </div>

                 <div id="rlInputContainer" class="mt-6 hidden">
                    <h3 class="text-md font-semibold text-blue-600 mb-2">Specify Curve Directions:</h3>
                    <div id="rlInputArea" class="p-3 border border-blue-300 bg-blue-50 rounded-lg text-sm text-blue-700">
                        <ul></ul>
                    </div>
                     <button id="updateRlButton" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-opacity-50 transition duration-150 ease-in-out">
                         Update Output with R/L Selections
                     </button>
                </div>

                <div id="warningsContainer" class="mt-6 hidden">
                    <h3 class="text-md font-semibold text-orange-600 mb-2">Warnings:</h3>
                    <div id="warningsArea" class="p-3 border border-orange-300 bg-orange-50 rounded-lg text-sm text-orange-700">
                        <ul></ul>
                    </div>
                </div>
            </div>

            <div>
                <div>
                    <label for="traversePlot" class="block text-sm font-medium text-gray-700 mb-1">Traverse Plot:</label>
                    <canvas id="traversePlot" width="400" height="300" class="w-full h-auto aspect-[4/3]"></canvas>
                </div>

                <div id="resultsContainer" class="mt-6 hidden">
                    <h3 class="text-md font-semibold text-gray-700 mb-2">Calculation Results:</h3>
                    <div id="resultsArea" class="p-3 border border-gray-300 bg-gray-50 rounded-lg text-sm text-gray-800 space-y-2">
                        </div>
                </div>
            </div>

        </div> </div> <script>
        // --- GLOBALS ---
        let parsedOutputForDownload = [];
        let segmentsDataForExport = [];
        let coordinatesForPlotting = [];
        let areaFromFile = null;
        let filePobCoords = null;
        let rawFileText = ''; // Store raw text for reprocessing
        let uncertainRlSegments = {}; // Store { segNum: segmentDataArray } for uncertain R/L

        // --- CONSTANTS ---
        const R2D = 180 / Math.PI;
        const D2R = Math.PI / 180;
        const GEOMETRY_TOLERANCE = 0.005; // feet
        const TANGENCY_TOLERANCE_DEGREES = (5 / 3600); // 5 seconds
        const NINETY_DEG_TOLERANCE = 1.0; // Tolerance for Tangent vs Radial check (degrees)
        const DELTA_TOLERANCE = 1.0; // Tolerance for Radial In vs Radial Out check (degrees)


        // --- DOM Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            // Get all DOM elements
            const txtFileInput = document.getElementById('txtFile');
            const fileEncodingSelect = document.getElementById('fileEncoding');
            const processButton = document.getElementById('processButton');
            const downloadButton = document.getElementById('downloadButton');
            const downloadCsvButton = document.getElementById('downloadCsvButton');
            const downloadKmlButton = document.getElementById('downloadKmlButton');
            const statusMessage = document.getElementById('statusMessage');
            const previewArea = document.getElementById('previewArea');
            const loader = document.getElementById('loader');
            const firstCurveRLSelect = document.getElementById('firstCurveRL');
            const warningsContainer = document.getElementById('warningsContainer');
            const warningsAreaUL = warningsContainer.querySelector('#warningsArea ul');
            const dropZone = document.getElementById('dropZone');
            const selectFileButton = document.getElementById('selectFileButton');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsArea = document.getElementById('resultsArea');
            const traversePlotCanvas = document.getElementById('traversePlot');
            const rlInputContainer = document.getElementById('rlInputContainer');
            const rlInputAreaUL = rlInputContainer.querySelector('#rlInputArea ul');
            const updateRlButton = document.getElementById('updateRlButton');


            // --- Drag & Drop / File Input Listeners ---
             selectFileButton.addEventListener('click', () => txtFileInput.click());
             dropZone.addEventListener('click', (e) => { if (e.target !== selectFileButton) txtFileInput.click(); });
             dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
             dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
             dropZone.addEventListener('drop', (e) => {
                 e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    if (files[0].name.endsWith('.txt')) {
                        txtFileInput.files = files; 
                        txtFileInput.dispatchEvent(new Event('change', { bubbles: true }));
                        processButton.click(); // Trigger process on drop
                    } else {
                        statusMessage.textContent = 'Please drop a .txt file.';
                        alert('Invalid file type. Please drop a .txt file.');
                    }
                }
            });
            
            txtFileInput.addEventListener('change', () => {
                if (txtFileInput.files.length > 0) {
                    statusMessage.textContent = `File selected: ${txtFileInput.files[0].name}`;
                    // Optionally auto-process on select: processButton.click();
                }
            });

            // --- Main Process Button Listener ---
            processButton.addEventListener('click', async () => {
                resetUIAndState();
                loader.classList.remove('hidden');

                const file = txtFileInput.files[0];
                const selectedEncoding = fileEncodingSelect.value === "auto" ? "UTF-8" : fileEncodingSelect.value;

                if (!file) {
                    statusMessage.textContent = 'Please select a .txt file.';
                    loader.classList.add('hidden');
                    return;
                }

                statusMessage.textContent = 'Reading file...';
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        rawFileText = event.target.result; // Store raw text
                        filePobCoords = parsePobCoordinates(rawFileText);
                        statusMessage.textContent = 'Parsing legal description...';
                        processFileData(firstCurveRLSelect.value); // Initial processing run
                    } catch (error) {
                        handleProcessingError(error);
                    } finally {
                        loader.classList.add('hidden');
                    }
                };
                reader.onerror = () => {
                     statusMessage.textContent = 'Error reading file.';
                     loader.classList.add('hidden');
                };
                reader.readAsText(file, selectedEncoding); 
            });

            // --- Update R/L Button Listener ---
            updateRlButton.addEventListener('click', () => {
                 const userOverrides = {};
                 let allSelected = true;
                 const selects = rlInputAreaUL.querySelectorAll('select');
                 selects.forEach(select => {
                     const segNum = select.dataset.segment;
                     const value = select.value;
                     if (value === 'L' || value === 'R') {
                         userOverrides[segNum] = value;
                     } else {
                         allSelected = false;
                         statusMessage.textContent = `Please select Left or Right for Segment #${segNum}.`;
                         // alert(`Please select Left or Right for Segment #${segNum}.`); // Optional alert
                     }
                 });

                if (!allSelected) {
                    return; // Stop if selections incomplete
                }

                 // Reset relevant parts but keep rawFileText and filePobCoords
                 resetUIAndState(false);
                 statusMessage.textContent = 'Re-processing with user selections...';
                 loader.classList.remove('hidden');

                 try {
                     // Rerun processing with the collected overrides
                     processFileData(firstCurveRLSelect.value, userOverrides);
                 } catch (error) {
                    handleProcessingError(error);
                 } finally {
                     loader.classList.add('hidden');
                 }
            });

            // --- Download Button Listeners ---
            downloadButton.addEventListener('click', async () => {
                 if (parsedOutputForDownload.length === 0 || Object.keys(uncertainRlSegments).length > 0) {
                    statusMessage.textContent = "Please resolve R/L selections before downloading."; return;
                 }
                statusMessage.textContent = "Generating text file...";
                try { await generateAndDownloadTxt(parsedOutputForDownload, "legal_description_parsed.txt"); statusMessage.textContent = 'Text file downloaded successfully!'; }
                catch (error) { statusMessage.textContent = `Error downloading file: ${error.message}`; }
            });
            downloadCsvButton.addEventListener('click', async () => {
                  if (segmentsDataForExport.length === 0 || Object.keys(uncertainRlSegments).length > 0) {
                     statusMessage.textContent = "Please resolve R/L selections before downloading."; return;
                  }
                statusMessage.textContent = "Generating CSV file...";
                try { await generateAndDownloadCsv(segmentsDataForExport); statusMessage.textContent = 'CSV file downloaded successfully!'; }
                catch (error) { statusMessage.textContent = `Error downloading CSV: ${error.message}`; }
            });
            downloadKmlButton.addEventListener('click', async () => {
                  if (coordinatesForPlotting.length <= 1 || Object.keys(uncertainRlSegments).length > 0) {
                     statusMessage.textContent = "Please resolve R/L selections before downloading."; return;
                  }
                statusMessage.textContent = "Generating KML file...";
                try { await generateAndDownloadKml(coordinatesForPlotting, segmentsDataForExport); statusMessage.textContent = 'KML file downloaded successfully!'; }
                catch (error) { statusMessage.textContent = `Error downloading KML: ${error.message}`; }
            });
        }); // <-- End of DOMContentLoaded

        // --- Central Processing Function ---
        function processFileData(firstCurveRLOverride, userRlOverrides = {}) {
            // Reset calculation/output related globals for each run
            parsedOutputForDownload = [];
            segmentsDataForExport = [];
            coordinatesForPlotting = [[0, 0]];
            areaFromFile = null;
            uncertainRlSegments = {}; // Clear uncertain list for this run

            const {
                formattedLines, warnings, areaSummaryLine, segmentsData,
                parsedAreaValue, uncertainSegments // Get uncertain segments from this run
            } = parseLegalDescription(rawFileText, firstCurveRLOverride, userRlOverrides); // Pass raw text and overrides

            // Store results from this run
            parsedOutputForDownload = [...formattedLines];
            segmentsDataForExport = [...segmentsData];
            areaFromFile = parsedAreaValue;
            uncertainRlSegments = uncertainSegments; // Store uncertain ones found

             if (areaSummaryLine) {
                 if (parsedOutputForDownload.length > 0 && parsedOutputForDownload[parsedOutputForDownload.length -1].trim() !== "") {
                     parsedOutputForDownload.push("");
                 }
                 parsedOutputForDownload.push(areaSummaryLine);
             }

            // Update UI based on results
            document.getElementById('previewArea').value = parsedOutputForDownload.join('\n');
            updateButtonsAndWarnings(warnings, uncertainRlSegments); // Handles showing R/L input if needed
            updateCalculationResultsAndPlot(); // Update plot and calcs
        }

        // --- UI Reset Function ---
        function resetUIAndState(fullReset = true) {
            document.getElementById('previewArea').value = '';
            parsedOutputForDownload = []; segmentsDataForExport = []; coordinatesForPlotting = [[0, 0]];
            areaFromFile = null; uncertainRlSegments = {};
            if (fullReset) { rawFileText = ''; filePobCoords = null; } // Only clear raw text on full reset

            const buttons = ['downloadButton', 'downloadCsvButton', 'downloadKmlButton'];
            buttons.forEach(id => {
                const btn = document.getElementById(id); btn.disabled = true;
                btn.classList.replace('bg-[#003366]', 'bg-gray-400'); btn.classList.replace('hover:bg-[#002244]', 'hover:bg-gray-500');
            });
            document.getElementById('warningsArea ul').innerHTML = ''; document.getElementById('warningsContainer').classList.add('hidden');
            document.getElementById('rlInputArea ul').innerHTML = ''; document.getElementById('rlInputContainer').classList.add('hidden'); // Hide R/L input
            document.getElementById('resultsArea').innerHTML = ''; document.getElementById('resultsContainer').classList.add('hidden');
            clearCanvas(document.getElementById('traversePlot')); document.getElementById('statusMessage').textContent = '';
        }

        // --- Error Handling Function ---
        function handleProcessingError(error) {
             console.error('Error:', error);
             document.getElementById('statusMessage').textContent = `Error: ${error.message}`;
             const warningsAreaUL = document.getElementById('warningsArea ul');
             if (!warningsAreaUL.textContent.includes(error.message)) { // Avoid duplicates
                const li = document.createElement('li'); li.textContent = error.message; warningsAreaUL.appendChild(li);
             }
             document.getElementById('warningsContainer').classList.remove('hidden');
             document.getElementById('loader').classList.add('hidden'); // Ensure loader hides
        }

        // --- Update UI Function (Handles R/L Input Display) ---
        function updateButtonsAndWarnings(warnings, uncertainSegments) {
            const warningsAreaUL = document.getElementById('warningsArea ul');
            const warningsContainer = document.getElementById('warningsContainer');
            const rlInputAreaUL = document.getElementById('rlInputArea ul');
            const rlInputContainer = document.getElementById('rlInputContainer');
            const statusMessage = document.getElementById('statusMessage');

            // --- R/L Input Area Update ---
            rlInputAreaUL.innerHTML = ''; // Clear previous inputs
            const uncertainKeys = Object.keys(uncertainSegments);
            if (uncertainKeys.length > 0) {
                 // Sort keys numerically before creating elements
                 uncertainKeys.sort((a, b) => parseInt(a) - parseInt(b)).forEach(segNum => {
                     const li = document.createElement('li');
                     li.innerHTML = `<span>Segment #${segNum}:</span> <select data-segment="${segNum}"><option value="">Select...</option><option value="L">Left</option><option value="R">Right</option></select>`;
                     rlInputAreaUL.appendChild(li);
                 });
                 rlInputContainer.classList.remove('hidden'); // Show the input section
                 statusMessage.textContent = 'Processing complete. Please specify R/L for curves above and click Update.';
                 // Ensure download buttons are disabled
                  document.getElementById('downloadButton').disabled = true;
                  document.getElementById('downloadCsvButton').disabled = true;
                  document.getElementById('downloadKmlButton').disabled = true;

            } else {
                 rlInputContainer.classList.add('hidden'); // Hide input section if resolved
                 // Enable downloads only if no uncertain R/L remain
                 if (parsedOutputForDownload.length > 0) {
                    const btn = document.getElementById('downloadButton'); btn.disabled = false; btn.classList.replace('bg-gray-400', 'bg-[#003366]'); btn.classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]');
                 }
                 if (segmentsDataForExport.length > 0) {
                     const btn = document.getElementById('downloadCsvButton'); btn.disabled = false; btn.classList.replace('bg-gray-400', 'bg-[#003366]'); btn.classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]');
                 }
                  if (coordinatesForPlotting.length > 1) {
                     const btn = document.getElementById('downloadKmlButton'); btn.disabled = false; btn.classList.replace('bg-gray-400', 'bg-[#003366]'); btn.classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]');
                  }
                 // Set final status message based on warnings
                 if (warnings.length > 0) statusMessage.textContent = 'Processing complete. Please review warnings.';
                 else if (parsedOutputForDownload.length > 0) statusMessage.textContent = 'Processing complete. Ready to download.';
                 else statusMessage.textContent = 'Processing complete. No data parsed.';
            }

            // --- Warnings Area Update ---
            warningsAreaUL.innerHTML = ''; // Clear previous warnings
            let uniqueWarnings = []; // Track unique warnings to display
            if (!filePobCoords && rawFileText.includes("Point of Beginning")) { // Add POB warning if applicable
                uniqueWarnings.push("Could not parse 'Point of Beginning' coordinates. Line endpoint validation skipped.");
            }
            warnings.forEach(w => { // Add other unique warnings from processing
                if (!uniqueWarnings.includes(w)) {
                    uniqueWarnings.push(w);
                }
            });

             if (uniqueWarnings.length > 0) {
                 uniqueWarnings.forEach(warning => {
                     const li = document.createElement('li'); li.textContent = warning; warningsAreaUL.appendChild(li);
                 });
                 warningsContainer.classList.remove('hidden'); // Show warnings if any exist
             } else {
                 warningsContainer.classList.add('hidden'); // Hide if no warnings
             }
        }

         // --- Update Calculations and Plot Function ---
         function updateCalculationResultsAndPlot() {
            if (coordinatesForPlotting.length > 1) {
                calculateAndDisplayResults(coordinatesForPlotting, areaFromFile);
                document.getElementById('resultsContainer').classList.remove('hidden');
                drawTraverse(document.getElementById('traversePlot'), coordinatesForPlotting);
            } else {
                 document.getElementById('resultsContainer').classList.add('hidden');
                 clearCanvas(document.getElementById('traversePlot'));
            }
         }

        // --- Core Parsing Logic ---

        // *** NEW Function ***
        function parsePobCoordinates(rawText) { // Un-minified for clarity
            const lines = rawText.split('\n');
            for (const line of lines) {
                const trimmedLine = line.trim();
                // Added optional single quote flexibility
                const pobMatch = trimmedLine.match(/Point\s+of\s+Beginning\s*:\s*North:\s*([\d\.]+)'?\s*East:\s*([\d\.]+)'?/i);
                if (pobMatch) {
                    const north = parseFloat(pobMatch[1]); const east = parseFloat(pobMatch[2]);
                    if (!isNaN(north) && !isNaN(east)) return { north: north, east: east };
                }
            }
            return null;
        }

        function parseLegalDescription(rawText, firstCurveRLOverride, userRlOverrides = {}) { // Accept overrides
            const allLinesFromFile = rawText.split('\n');
            const formattedLines = []; const warnings = []; let segmentsData = [];
            let currentSegmentData = []; let segmentType = null; let lastSegmentCourseString = null;
            let segmentCounter = 0; let areaSummaryLine = null; let parsedAreaValue = null;
            let lastSegmentWasCurve = false; let uncertainSegmentsOutput = {}; // Track uncertain segments for this run
            let currentCoordinates = [0, 0]; coordinatesForPlotting = [[0, 0]]; // Reset global plot coords for this run

        function expandDirection(shorthand) {
            const map = { 'N': 'North', 'S': 'South', 'E': 'East', 'W': 'West' };

        function parseDMS(dmsString) {
            if (!dmsString) return null;
            const match = dmsString.match(/(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?/i);
            if (match) {
                const d = parseInt(match[1]);
                const m = parseInt(match[2]);
                const s = parseFloat(match[3]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(s)) {
                    return d + m / 60 + s / 3600;
                }
            }
            console.warn("Failed to parse DMS string:", dmsString);
            return null; 
        }


        function parseBearing(bearingString) {
            if (!bearingString) return null;
            const match = bearingString.match(/([NSEW])\s*(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?\s*([NSEW])/i);

                const cardinalMatch = bearingString.match(/^\s*([NSEW])\s*$/i);
                if (cardinalMatch) {
                    return { dir1: cardinalMatch[1].toUpperCase(), deg: 0, min: 0, sec: 0, dir2: '' };
                }
                return null;
            }
            return {
                dir1: match[1].toUpperCase(), deg: parseInt(match[2]), min: parseInt(match[3]), sec: parseFloat(match[4]), dir2: match[5].toUpperCase(),
            };
        }
        
        function bearingToAzimuth(bearing) {
             if (!bearing) return null;
             // Ensure sec is a number, default to 0 if missing/NaN
             const sec = (typeof bearing.sec === 'number' && !isNaN(bearing.sec)) ? bearing.sec : 0;
             const angle = bearing.deg + bearing.min / 60 + sec / 3600;

             if (bearing.dir1 === 'N' && bearing.dir2 === 'E') return angle;
             if (bearing.dir1 === 'S' && bearing.dir2 === 'E') return 180 - angle;
             if (bearing.dir1 === 'S' && bearing.dir2 === 'W') return 180 + angle;
             if (bearing.dir1 === 'N' && bearing.dir2 === 'W') return 360 - angle;
             // Handle cardinal directions (dir2 is empty or undefined)
             if (bearing.dir1 === 'N' && !bearing.dir2) return 0;
             if (bearing.dir1 === 'E' && !bearing.dir2) return 90;
             if (bearing.dir1 === 'S' && !bearing.dir2) return 180;
             if (bearing.dir1 === 'W' && !bearing.dir2) return 270;
             console.warn("Could not convert bearing to azimuth:", bearing); // Log unexpected cases
             return null;
        }


        // Convert Azimuth back to Bearing
        function azimuthToBearing(azimuth) {
            if (azimuth === null || isNaN(azimuth)) return null;
             azimuth = (azimuth % 360 + 360) % 360; // Normalize

            let dms = decimalToDMS(azimuth);
            
            // Use a small tolerance for cardinal checks
            const epsilon = 1e-9; 
            if (Math.abs(azimuth - 0) < epsilon || Math.abs(azimuth - 360) < epsilon) return { dir1: 'N', deg: 0, min: 0, sec: 0, dir2: '', s_precise: 0 };

            if (Math.abs(azimuth - 270) < epsilon) return { dir1: 'W', deg: 0, min: 0, sec: 0, dir2: '', s_precise: 0 };

            const mDecimal = (absDegrees - d) * 60;
            const m = Math.floor(mDecimal);
            const sDecimal = (mDecimal - m) * 60;

                return { d, m: newM, s: s_rounded, s_precise: s_precise };
            }
            return { d, m, s: s_rounded, s_precise: s_precise };
        }

        function formatDMS(dms) {

        function calculateMisclosure(coordinates) {
            if (coordinates.length < 2) return null;
            const startPoint = coordinates[0];
            const endPoint = coordinates[coordinates.length - 1];
            
            const deltaX = endPoint[0] - startPoint[0];
            const deltaY = endPoint[1] - startPoint[1];
            
            const misclosureDist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            let totalPerimeter = 0;
            for (let i = 0; i < coordinates.length - 1; i++) {
                const p1 = coordinates[i];
                const p2 = coordinates[i+1];
                totalPerimeter += Math.sqrt(Math.pow(p2[0] - p1[0], 2) + Math.pow(p2[1] - p1[1], 2));

        function clearCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

        function drawTraverse(canvas, coordinates) { // NEW: Add highlightSegment
            if (coordinates.length < 2) return;
            const ctx = canvas.getContext('2d');
            clearCanvas(canvas);

            // 1. Find bounds
            let minX = coordinates[0][0], maxX = coordinates[0][0];
            let minY = coordinates[0][1], maxY = coordinates[0][1];
            
            for (const [x, y] of coordinates) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }

            // 2. Determine scale and padding
            const padding = 20;
            const plotWidth = canvas.width - 2 * padding;
            const plotHeight = canvas.height - 2 * padding;
            const dataWidth = maxX - minX;
            const dataHeight = maxY - minY;

            if (dataWidth === 0 && dataHeight === 0) {
                 // Single point, draw a dot
                ctx.fillStyle = '#003366';
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, 3, 0, 2 * Math.PI);
                ctx.fill();
                return;
            }
            // Ensure non-zero dimensions for scaling
            const effectiveDataWidth = dataWidth === 0 ? 1 : dataWidth;
            const effectiveDataHeight = dataHeight === 0 ? 1 : dataHeight;

            const scaleX = plotWidth / effectiveDataWidth;
            const scaleY = plotHeight / effectiveDataHeight;
            const scale = Math.min(scaleX, scaleY);

            // 3. Create transform function
            // We flip Y because canvas (0,0) is top-left, but survey (0,0) is bottom-left
            const transform = (x, y) => {
                const tx = padding + (x - minX) * scale;
                const ty = padding + (maxY - y) * scale; // Flip Y-axis
                return [tx, ty];
            };

            // 4. Draw segments
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            const [startX, startY] = transform(coordinates[0][0], coordinates[0][1]);
            ctx.moveTo(startX, startY);
            
            for (let i = 1; i < coordinates.length; i++) {
                const [x, y] = transform(coordinates[i][0], coordinates[i][1]);
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 5. Draw POB and POE
            ctx.fillStyle = 'green'; // POB
            ctx.beginPath();
            ctx.arc(startX, startY, 4, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = 'red'; // POE
            const [endX, endY] = transform(coordinates[coordinates.length - 1][0], coordinates[coordinates.length - 1][1]);
            ctx.beginPath();
            ctx.arc(endX, endY, 4, 0, 2 * Math.PI);
            ctx.fill();
        }

        function drawTraverse(c,coords){if(coords.length<2)return;const ctx=c.getContext('2d');clearCanvas(c);let minX=coords[0][0],maxX=coords[0][0],minY=coords[0][1],maxY=coords[0][1];for(const[x,y]of coords){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}const p=20,pw=c.width-2*p,ph=c.height-2*p,dw=maxX-minX,dh=maxY-minY;if(dw===0&&dh===0){ctx.fillStyle='#003366';ctx.beginPath();ctx.arc(c.width/2,c.height/2,3,0,2*Math.PI);ctx.fill();return;}const edw=dw===0?1:dw,edh=dh===0?1:dh,scX=pw/edw,scY=ph/edh,sc=Math.min(scX,scY);const tr=(x,y)=>[p+(x-minX)*sc,p+(maxY-y)*sc];ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();const[sx,sy]=tr(coords[0][0],coords[0][1]);ctx.moveTo(sx,sy);for(let i=1;i<coords.length;i++){const[x,y]=tr(coords[i][0],coords[i][1]);ctx.lineTo(x,y);}ctx.stroke();ctx.fillStyle='green';ctx.beginPath();ctx.arc(sx,sy,4,0,2*Math.PI);ctx.fill();ctx.fillStyle='red';const[ex,ey]=tr(coords[coords.length-1][0],coords[coords.length-1][1]);ctx.beginPath();ctx.arc(ex,ey,4,0,2*Math.PI);ctx.fill();}

            }

        async function generateAndDownloadKml(coordinates, segmentsData) {
            try {
                // KML uses Lon, Lat, Alt. We are using X, Y, Z.
                // We will treat X as Lon and Y as Lat for plotting.
                let kmlCoordinates = coordinates.map(c => `${c[0]},${c[1]},0`).join(' ');
