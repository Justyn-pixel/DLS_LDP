<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Description Parser - Diamond Land Surveying</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('assets/background-topo.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
        }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #555; }
        .loader { 
            border: 5px solid #f3f3f3; 
            border-top: 5px solid #003366; 
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #warningsArea ul { list-style-type: disc; margin-left: 20px; }
        #warningsArea li { margin-bottom: 4px; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #003366 !important; 
            box-shadow: 0 0 0 2px rgba(0, 51, 102, 0.3) !important;
        }
        #dropZone.dragover {
            border-color: #003366; 
            background-color: rgba(0, 51, 102, 0.05); 
        }
        .info-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            border-radius: 50%;
            background-color: #003366; 
            color: white;
            font-size: 10px;
            font-weight: bold;
            cursor: help;
            margin-left: 4px;
            position: relative; 
        }
        .tooltip {
            visibility: hidden;
            width: 220px;
            background-color: #333;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 10;
            bottom: 125%; 
            left: 50%;
            margin-left: -110px; 
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.75rem; 
            line-height: 1.25; 
        }
        .tooltip::after { 
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        .info-icon-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-2xl">
        <div class="text-center mb-10">
            <div class="inline-block mb-3">
                 <img src="https://www.diamondlandsurveying.com/wp-content/uploads/2019/04/diamond-logo-1.jpg" alt="Diamond Land Surveying Logo" class="h-20 w-auto mx-auto">
            </div>
            <h1 class="text-3xl font-bold text-gray-800" style="font-family: 'Montserrat', sans-serif;">Legal Description Parser</h1>
            <p class="text-xs text-gray-500 mt-1">Powered by Gemini</p>
        </div>

        <div id="dropZone" class="mb-6 border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-[#003366] hover:bg-gray-50 transition-colors">
            <p class="text-gray-500 pointer-events-none">Drag & Drop .txt file here or 
                <button id="selectFileButton" class="text-[#003366] hover:text-[#002244] font-semibold underline focus:outline-none">select a file</button>
            </p>
            <input type="file" id="txtFile" accept=".txt" class="hidden"> </div>
        
        <div class="flex flex-col sm:flex-row sm:items-end sm:space-x-4 mb-6">
            <div class="flex-1 mb-4 sm:mb-0">
                <label for="fileEncoding" class="block text-xs font-medium text-gray-600 mb-1">
                    Encoding:
                    <span class="info-icon-container relative">
                        <span class="info-icon">i</span>
                        <span class="tooltip">Select file encoding. If you see strange characters (like ), try a different encoding or re-save your file as UTF-8.</span>
                    </span>
                </label>
                <select id="fileEncoding" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto">Auto (UTF-8)</option>
                    <option value="windows-1252" selected>ANSI (Win-1252)</option>
                    <option value="ISO-8859-1">ANSI (ISO-8859-1)</option>
                </select>
            </div>
            <div class="flex-1">
                <label for="firstCurveRL" class="block text-xs font-medium text-gray-600 mb-1">
                    1st Curve Dir:
                    <span class="info-icon-container relative">
                        <span class="info-icon">i</span>
                        <span class="tooltip">If the very first segment in your file is a curve, specify its direction (Left/Right) here. Otherwise, 'Auto-detect' is recommended.</span>
                    </span>
                </label>
                <select id="firstCurveRL" class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-sm h-10">
                    <option value="auto" selected>Auto-detect</option>
                    <option value="L">Left</option>
                    <option value="R">Right</option>
                </select>
            </div>
        </div>


        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <button id="processButton" class="w-full bg-[#003366] hover:bg-[#002244] text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-[#003366] focus:ring-opacity-50 transition duration-150 ease-in-out">
                Process File
            </button>
            <button id="downloadButton" class="w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-opacity-50 transition duration-150 ease-in-out" disabled>
                Download Text File
            </button>
        </div>

        <div id="statusArea" class="mt-6 text-center">
            <div id="loader" class="loader hidden"></div>
            <p id="statusMessage" class="text-sm text-gray-600"></p>
        </div>
        
        <div class="mt-8">
            <label for="previewArea" class="block text-sm font-medium text-gray-700 mb-1">Parsed Output Preview:</label>
            <textarea id="previewArea" rows="10" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 text-sm text-gray-800" readonly placeholder="Parsed legal description will appear here..."></textarea>
        </div>

        <div id="warningsContainer" class="mt-6 hidden">
            <h3 class="text-md font-semibold text-orange-600 mb-2">Warnings:</h3>
            <div id="warningsArea" class="p-3 border border-orange-300 bg-orange-50 rounded-lg text-sm text-orange-700">
                <ul></ul>
            </div>
        </div>
        </div>

    <script>
        let parsedOutputForDownload = [];

        document.addEventListener('DOMContentLoaded', () => {
            const txtFileInput = document.getElementById('txtFile');
            const fileEncodingSelect = document.getElementById('fileEncoding');
            const processButton = document.getElementById('processButton');
            const downloadButton = document.getElementById('downloadButton');
            const statusMessage = document.getElementById('statusMessage');
            const previewArea = document.getElementById('previewArea');
            const loader = document.getElementById('loader');
            const firstCurveRLSelect = document.getElementById('firstCurveRL');
            const warningsContainer = document.getElementById('warningsContainer');
            const warningsAreaUL = warningsContainer.querySelector('#warningsArea ul');
            const dropZone = document.getElementById('dropZone');
            const selectFileButton = document.getElementById('selectFileButton');

            selectFileButton.addEventListener('click', () => {
                txtFileInput.click(); 
            });

            dropZone.addEventListener('click', (event) => {
                if (event.target !== selectFileButton) {
                    txtFileInput.click();
                }
            });

            dropZone.addEventListener('dragover', (event) => {
                event.preventDefault(); 
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', (event) => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (event) => {
                event.preventDefault();
                dropZone.classList.remove('dragover');
                const files = event.dataTransfer.files;
                if (files.length > 0) {
                    if (files[0].name.endsWith('.txt')) {
                        txtFileInput.files = files; 
                        const changeEvent = new Event('change', { bubbles: true });
                        txtFileInput.dispatchEvent(changeEvent);
                        processButton.click(); 
                    } else {
                        statusMessage.textContent = 'Please drop a .txt file.';
                        alert('Invalid file type. Please drop a .txt file.');
                    }
                }
            });
            
            txtFileInput.addEventListener('change', () => {
                if (txtFileInput.files.length > 0) {
                    // processButton.click(); // Optionally auto-process
                }
            });

            processButton.addEventListener('click', async () => {
                previewArea.value = ''; 
                parsedOutputForDownload = []; 
                downloadButton.disabled = true; 
                downloadButton.classList.replace('bg-[#003366]', 'bg-gray-400'); 
                downloadButton.classList.replace('hover:bg-[#002244]', 'hover:bg-gray-500'); 

                statusMessage.textContent = 'Initializing...';
                warningsAreaUL.innerHTML = ''; 
                warningsContainer.classList.add('hidden');
                loader.classList.remove('hidden');

                const file = txtFileInput.files[0];
                const selectedEncoding = fileEncodingSelect.value === "auto" ? undefined : fileEncodingSelect.value;
                const firstCurveRLOverride = firstCurveRLSelect.value;

                if (!file) {
                    statusMessage.textContent = 'Please select a .txt file.';
                    loader.classList.add('hidden');
                    return;
                }

                statusMessage.textContent = 'Reading file...';
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        statusMessage.textContent = 'Parsing legal description...';
                        const rawText = event.target.result;
                        const {formattedLines, warnings, areaSummaryLine} = parseLegalDescription(rawText, firstCurveRLOverride);
                        
                        parsedOutputForDownload = [...formattedLines]; 

                        if (areaSummaryLine) {
                            if (parsedOutputForDownload.length > 0 && parsedOutputForDownload[parsedOutputForDownload.length -1].trim() !== "") { 
                                parsedOutputForDownload.push(""); 
                            }
                            parsedOutputForDownload.push(areaSummaryLine);
                        }
                        
                        previewArea.value = parsedOutputForDownload.join('\n');
                        
                        if (parsedOutputForDownload.length > 0) { 
                            downloadButton.disabled = false;
                            downloadButton.classList.replace('bg-gray-400', 'bg-[#003366]'); 
                            downloadButton.classList.replace('hover:bg-gray-500', 'hover:bg-[#002244]'); 
                        }
                        
                        if (warnings.length > 0) {
                            warnings.forEach(warning => {
                                const li = document.createElement('li');
                                li.textContent = warning;
                                warningsAreaUL.appendChild(li);
                            });
                            warningsContainer.classList.remove('hidden');
                            statusMessage.textContent = 'Processing complete. Please review warnings.';
                        } else if (parsedOutputForDownload.length > 0) {
                           statusMessage.textContent = 'Processing complete. Ready to download.'; 
                        } else {
                           statusMessage.textContent = 'Processing complete. No data parsed.';
                        }
                        
                    } catch (error) {
                        console.error('Error processing file:', error);
                        statusMessage.textContent = `Error: ${error.message}`;
                    } finally {
                        loader.classList.add('hidden');
                    }
                };
                reader.onerror = () => {
                    statusMessage.textContent = 'Error reading file.';
                    loader.classList.add('hidden');
                };
                reader.readAsText(file, selectedEncoding); 
            });

            downloadButton.addEventListener('click', async () => {
                if (parsedOutputForDownload.length === 0) {
                    statusMessage.textContent = "No processed data to download.";
                    return;
                }
                statusMessage.textContent = "Generating text file...";
                try {
                    await generateAndDownloadTxt(parsedOutputForDownload);
                    statusMessage.textContent = 'Text file downloaded successfully!';
                } catch (error) {
                    statusMessage.textContent = `Error downloading file: ${error.message}`;
                }
            });
        });

        function expandDirection(shorthand) {
            const map = { 'N': 'North', 'S': 'South', 'E': 'East', 'W': 'West' };
            return map[shorthand] || shorthand;
        }
        
        function parseDMS(dmsString) {
            if (!dmsString) return null;
            const match = dmsString.match(/(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?/i);
            if (match) {
                const d = parseInt(match[1]);
                const m = parseInt(match[2]);
                const s = parseFloat(match[3]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(s)) {
                    return d + m / 60 + s / 3600;
                }
            }
            console.warn("Failed to parse DMS string:", dmsString);
            return null; 
        }


        function parseBearing(bearingString) {
            if (!bearingString) return null;
            const match = bearingString.match(/([NSEW])\s*(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?\s*([NSEW])/i);
            if (!match) {
                const cardinalMatch = bearingString.match(/^([NSEW])$/i);
                if (cardinalMatch) {
                    return {
                        dir1: cardinalMatch[1].toUpperCase(),
                        deg: 0, min: 0, sec: 0, 
                        dir2: '' 
                    };
                }
                return null;
            }
            return {
                dir1: match[1].toUpperCase(),
                deg: parseInt(match[2]),
                min: parseInt(match[3]),
                sec: parseFloat(match[4]),
                dir2: match[5].toUpperCase(),
            };
        }
        
        function bearingToAzimuth(bearing) {
            if (!bearing) return null;
            const angle = bearing.deg + bearing.min / 60 + bearing.sec / 3600;
            if (bearing.dir1 === 'N' && bearing.dir2 === 'E') return angle;
            if (bearing.dir1 === 'S' && bearing.dir2 === 'E') return 180 - angle;
            if (bearing.dir1 === 'S' && bearing.dir2 === 'W') return 180 + angle;
            if (bearing.dir1 === 'N' && bearing.dir2 === 'W') return 360 - angle;
            if (bearing.dir1 === 'N' && bearing.dir2 === '') return 0;
            if (bearing.dir1 === 'E' && bearing.dir2 === '') return 90;
            if (bearing.dir1 === 'S' && bearing.dir2 === '') return 180;
            if (bearing.dir1 === 'W' && bearing.dir2 === '') return 270;
            return null;
        }

        function decimalToDMS(decimalDegrees) {
            const d = Math.floor(decimalDegrees);
            const mDecimal = (decimalDegrees - d) * 60;
            const m = Math.floor(mDecimal);
            const sDecimal = (mDecimal - m) * 60;
            let s = Math.round(sDecimal * 100) / 100; 
            
            if (s >= 59.995) { 
                s = 0;
                let newM = m + 1;
                if (newM === 60) {
                    newM = 0;
                    return { d: d + 1, m: newM, s };
                }
                return { d, m: newM, s };
            }
            return { d, m, s };
        }

        function formatDMS(dms) {
            const formattedSeconds = dms.s % 1 === 0 ? String(Math.round(dms.s)).padStart(2, '0') : dms.s.toFixed(2).padStart(5, '0');
            return `${dms.d}°${String(dms.m).padStart(2, '0')}'${formattedSeconds}"`;
        }
        
        function parseLegalDescription(rawText, firstCurveRLOverride) {
            const allLinesFromFile = rawText.split('\n');
            const formattedLines = [];
            const warnings = [];
            let currentSegmentData = [];
            let segmentType = null; 
            let lastSegmentCourseString = null; 
            let segmentCounter = 0; 
            let areaSummaryLine = null; 

            for (const line of allLinesFromFile) {
                const trimmedLine = line.trim();
                const segmentHeaderMatch = trimmedLine.match(/^Segment\s+#(\d+)\s*:\s*(Line|Curve)/i);
                const areaMatchTest = trimmedLine.match(/Area:\s*([\d.,]+)\s*Sq\.\s*Ft\.?/i); 

                if (segmentHeaderMatch) {
                    if (segmentType && currentSegmentData.length > 0) {
                        const result = processSegment(currentSegmentData, segmentType, lastSegmentCourseString, 
                                                      firstCurveRLOverride, 
                                                      segmentCounter, formattedLines.length === 0); 
                        if (result.text) formattedLines.push(result.text);
                        if (result.warning) warnings.push(result.warning);
                        if (result.lastCourse) lastSegmentCourseString = result.lastCourse;
                    }
                    segmentCounter = parseInt(segmentHeaderMatch[1]); 
                    segmentType = segmentHeaderMatch[2]; 
                    currentSegmentData = []; 
                    continue; 
                } else if (areaMatchTest) { 
                    if (segmentType && currentSegmentData.length > 0) {
                        const result = processSegment(currentSegmentData, segmentType, lastSegmentCourseString, 
                                                      firstCurveRLOverride, 
                                                      segmentCounter, formattedLines.length === 0);
                        if (result.text) formattedLines.push(result.text);
                        if (result.warning) warnings.push(result.warning);
                    }
                    segmentType = null; 
                    currentSegmentData = []; 
                }


                if (segmentType && trimmedLine !== "") {
                    currentSegmentData.push(trimmedLine);
                }
            }

            if (segmentType && currentSegmentData.length > 0) {
                 const result = processSegment(currentSegmentData, segmentType, lastSegmentCourseString, 
                                              firstCurveRLOverride, 
                                              segmentCounter, formattedLines.length === 0);
                if (result.text) formattedLines.push(result.text);
                if (result.warning) warnings.push(result.warning);
            }
            
            for (const line of allLinesFromFile) {
                const trimmedLine = line.trim();
                const areaMatch = trimmedLine.match(/Area:\s*([\d.,]+)\s*Sq\.\s*Ft\.?/i); 
                if (areaMatch) {
                    try {
                        const sqFtValueString = areaMatch[1].replace(/,/g, ''); 
                        const sqFtValue = parseFloat(sqFtValueString);
                        if (!isNaN(sqFtValue)) {
                            const formattedSqFt = Math.round(sqFtValue).toLocaleString('en-US');
                            const acres = sqFtValue / 43560;
                            const formattedAcres = acres.toFixed(3);
                            areaSummaryLine = `contains ${formattedSqFt} sq. ft. or ${formattedAcres} Acres`;
                        } else {
                            warnings.push(`Could not parse square footage value from Area data: "${areaMatch[0]}"`);
                        }
                    } catch (e) {
                        warnings.push(`Error processing Area data "${areaMatch[0]}": ${e.message}`);
                    }
                    break; 
                }
            }
            if (!areaSummaryLine && allLinesFromFile.some(line => /area:/i.test(line) && !warnings.some(w => w.toLowerCase().includes("area summary line was not generated")))) {
                 warnings.push("Area summary line was not generated. Check input file for 'Area: ... Sq. Ft.' format.");
            }
            
            return {formattedLines, warnings, areaSummaryLine}; 
        }

        function processSegment(segmentData, type, prevLineCourseStr, curveRLOverride, currentSegmentNumber, isFirstSegment) {
            let outputText = "";
            let warning = null;
            let lastCourseForNextSegment = null;
            const segmentContext = `(Segment #${currentSegmentNumber})`;

            if (type.toLowerCase() === 'line') {
                const courseLengthLine = segmentData.find(l => l.toLowerCase().startsWith('course:'));
                if (courseLengthLine) {
                    const courseMatch = courseLengthLine.match(/Course:\s*([NSEW])\s*(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?\s*([NSEW])/i);
                    const lengthMatch = courseLengthLine.match(/Length:\s*([\d\.]+)'?/i);

                    if (courseMatch && lengthMatch) {
                        const bearing = {
                            dir1: courseMatch[1].toUpperCase(),
                            deg: parseInt(courseMatch[2]),
                            min: parseInt(courseMatch[3]),
                            sec: parseFloat(courseMatch[4]),
                            dir2: courseMatch[5].toUpperCase()
                        };
                        const length = parseFloat(lengthMatch[1]);
                        const roundedSeconds = Math.round(bearing.sec);

                        outputText = `thence ${expandDirection(bearing.dir1)} ${bearing.deg}°${String(bearing.min).padStart(2, '0')}'${String(roundedSeconds).padStart(2, '0')}" ${expandDirection(bearing.dir2)} ${length.toFixed(2)} feet`;
                        lastCourseForNextSegment = `${bearing.dir1} ${bearing.deg}°${bearing.min}'${bearing.sec}" ${bearing.dir2}`;
                    } else {
                         warning = `Malformed line segment data (missing Course or Length details): "${courseLengthLine}" ${segmentContext}.`;
                    }
                } else {
                    warning = `No course/length data found for line segment ${segmentContext}. Data: ${segmentData.join('; ')}.`;
                }
            } else if (type.toLowerCase() === 'curve') {
                let curve = { courseInStr: null, courseInBearing: null };
                segmentData.forEach(line => {
                    let match;
                    if ((match = line.match(/Length:\s*([\d\.]+)'?\s*Radius:\s*([\d\.]+)'?/i))) {
                        curve.length = parseFloat(match[1]);
                        curve.radius = parseFloat(match[2]);
                    } else if ((match = line.match(/^Delta:\s*(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?/i))) { 
                        curve.deltaDecimal = parseDMS(match[0].replace(/^Delta:\s*/i, ''));
                        if (curve.deltaDecimal === null && warning === null) { 
                            warning = `Could not parse DMS Delta: "${match[0]}" ${segmentContext}.`;
                        }
                    } else if (!curve.deltaDecimal && (match = line.match(/Delta Angle:\s*([\d\.]+)\s*\(d\)/i))) { 
                        curve.deltaDecimal = parseFloat(match[1]);
                    } else if ((match = line.match(/Chord:\s*([\d\.]+)'?\s*Course:\s*([NSEW])\s*(\d{1,3})\s*[°\uFFFD]?\s*(\d{1,2})\s*['\u2019\u2018]?\s*([\d\.]+)\s*["\u201D\u201C]?\s*([NSEW])/i))) { 
                        curve.chordLength = parseFloat(match[1]);
                        curve.chordBearing = {
                            dir1: match[2].toUpperCase(),
                            deg: parseInt(match[3]),
                            min: parseInt(match[4]),
                            sec: parseFloat(match[5]),
                            dir2: match[6].toUpperCase()
                        };
                        curve.chordCourseStr = `${match[2]} ${match[3]}°${match[4]}'${match[5]}" ${match[6]}`;
                    } else if ((match = line.match(/Course In:\s*([NSEW\d\s°'"\uFFFD\u2019\u2018\u201D\u201C\.]+)/i))) { 
                        curve.courseInStr = match[1].trim();
                        curve.courseInBearing = parseBearing(curve.courseInStr);
                    }
                });

                if (curve.length !== undefined && curve.radius !== undefined && curve.deltaDecimal !== undefined && 
                    curve.chordLength !== undefined && curve.chordBearing !== undefined) {
                    
                    const dmsDelta = decimalToDMS(curve.deltaDecimal);
                    let rl_display = "R/L"; 
                    let nonTangentLabelText = ""; 
                    let rlVerifyLabelText = ""; 

                    const TANGENCY_TOLERANCE_DEGREES = 0.01; 

                    if (prevLineCourseStr && curve.courseInBearing) {
                        const prevLineBearingObj = parseBearing(prevLineCourseStr);
                        const prevLineAzimuth = bearingToAzimuth(prevLineBearingObj);
                        const courseInAzimuth = bearingToAzimuth(curve.courseInBearing);

                        if (prevLineAzimuth !== null && courseInAzimuth !== null) {
                            const diff = Math.abs(prevLineAzimuth - courseInAzimuth);
                            const isEffectivelyCollinear = (Math.abs(diff) <= TANGENCY_TOLERANCE_DEGREES) || 
                                                         (Math.abs(diff - 180) <= TANGENCY_TOLERANCE_DEGREES) ||
                                                         (Math.abs(diff - 360) <= TANGENCY_TOLERANCE_DEGREES);
                            if (!isEffectivelyCollinear) {
                                nonTangentLabelText = "(Non-Tangent)";
                            }
                        } else {
                             if (warning === null) warning = ""; 
                             warning += (warning ? " " : "") + `Could not compare for tangency due to azimuth calculation error ${segmentContext}. Prev: ${prevLineCourseStr}, CourseIn: ${curve.courseInStr || 'Not Found'}.`;
                        }
                    } else if (prevLineCourseStr && !curve.courseInStr) {
                         if (warning === null) warning = "";
                         warning += (warning ? " " : "") + `"Course In:" data missing for curve ${segmentContext}, cannot determine tangency.`;
                    }

                    if (curveRLOverride !== "auto" && isFirstSegment) { 
                        rl_display = curveRLOverride === "L" ? "Left" : "Right";
                        if (warning === null) warning = "";
                        warning += (warning ? " " : "") + `R/L for first curve manually set to ${rl_display} ${segmentContext}.`;
                    } else if (prevLineCourseStr) {
                        const tangentInBearing = parseBearing(prevLineCourseStr); 
                        const tangentInAzimuth = bearingToAzimuth(tangentInBearing); 
                        const chordAzimuth = bearingToAzimuth(curve.chordBearing); 

                        if (tangentInAzimuth !== null && chordAzimuth !== null) {
                            let deflectionToChord = chordAzimuth - tangentInAzimuth;
                            if (deflectionToChord > 180) deflectionToChord -= 360;
                            if (deflectionToChord < -180) deflectionToChord += 360;
                            const deltaHalf = curve.deltaDecimal / 2;
                            
                            if (Math.abs(Math.abs(deflectionToChord) - deltaHalf) < 2.5) { 
                                rl_display = deflectionToChord > 0 ? "Right" : "Left";
                            } else {
                                rl_display = "R/L"; 
                                rlVerifyLabelText = "(R/L Verify)";
                                if (warning === null) warning = "";
                                warning += (warning ? " " : "") + `Curve R/L detection uncertain ${segmentContext}. Deflection to chord (${deflectionToChord.toFixed(2)}°) vs. Delta/2 (${deltaHalf.toFixed(2)}°) differs. Prev: ${prevLineCourseStr}, Chord: ${curve.chordCourseStr}. Please verify.`;
                            }
                        } else {
                             rl_display = "R/L";
                             rlVerifyLabelText = "(R/L Calc Error)";
                             if (warning === null) warning = "";
                             warning += (warning ? " " : "") + `Could not determine R/L for curve ${segmentContext}: Azimuth calculation failed. Prev: ${prevLineCourseStr}, Chord: ${curve.chordCourseStr}.`;
                        }
                    } else if (curveRLOverride === "auto") { 
                         rl_display = "R/L";
                         rlVerifyLabelText = "(R/L Needs Prev. Line/Override)";
                         if (!nonTangentLabelText) { 
                            if (warning === null) warning = "";
                            warning += (warning ? " " : "") + `Curve R/L ${segmentContext} cannot be auto-determined: No previous line segment course and no override. May be the first segment.`;
                         }
                    }
                    
                    let prefixOutput = "";
                    if (nonTangentLabelText) prefixOutput += nonTangentLabelText + " ";
                    if (rlVerifyLabelText) prefixOutput += rlVerifyLabelText + " ";

                    const roundedChordSeconds = Math.round(curve.chordBearing.sec);
                    outputText = `${prefixOutput.trim()} thence ${curve.length.toFixed(2)} feet along the arc of a ${curve.radius.toFixed(2)} foot radius curve to the ${rl_display}, through a central angle of ${formatDMS(dmsDelta)}, with a long chord of ${expandDirection(curve.chordBearing.dir1)} ${curve.chordBearing.deg}°${String(curve.chordBearing.min).padStart(2,'0')}'${String(roundedChordSeconds).padStart(2,'0')}" ${expandDirection(curve.chordBearing.dir2)} ${curve.chordLength.toFixed(2)} feet;`;
                    
                } else {
                    let missingFields = [];
                    if (curve.length === undefined) missingFields.push("Length");
                    if (curve.radius === undefined) missingFields.push("Radius");
                    if (curve.deltaDecimal === undefined) missingFields.push("Delta Angle (decimal or DMS)");
                    if (curve.chordLength === undefined) missingFields.push("Chord Length");
                    if (curve.chordBearing === undefined) missingFields.push("Chord Course");
                    if (warning === null) warning = ""; 
                    warning += (warning ? " " : "") + `Incomplete curve data ${segmentContext}. Missing: ${missingFields.join(', ')}. Found: ${JSON.stringify(curve)}. Original data: ${segmentData.join('; ')}.`;
                }
                lastCourseForNextSegment = null; 
            }
            return { text: outputText, warning: warning ? warning.trim() : null, lastCourse: lastCourseForNextSegment };
        }

        async function generateAndDownloadTxt(formattedLinesArray) { 
            try {
                const textContent = formattedLinesArray.join('\n');
                const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" }); 
                saveAs(blob, `legal_description_parsed.txt`); 
            } catch (error) {
                console.error("Error generating TXT file:", error);
                throw new Error('Error generating text file. See console for details.'); 
            }
        }
    </script>
</body>
